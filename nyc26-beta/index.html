<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#121212">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="NYC '26">
<title>NYC Kış '26 · Necmi & Ahmet</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{
  --paper:#f2eee4;--paper2:#e9e4d6;--card:#fbfaf6;--ink:#121212;--ink2:#2b2a27;--mute:#6f6a5f;--line:#d8d1bf;--line2:#c9c0a9;
  --red:#e1251b;--green:#00933c;--blue:#0039a6;--yellow:#fccc0a;--orange:#ff6319;--purple:#b933ad;--brown:#996633;--lime:#6cbe45;
  --sign:#121212;--signText:#f2eee4;
  --safeT:env(safe-area-inset-top,0px);--safeB:env(safe-area-inset-bottom,0px);
  --f:"Archivo","Helvetica Neue",Helvetica,Arial,sans-serif;--m:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f);font-size:15px;line-height:1.35}
body{padding-bottom:calc(66px + var(--safeB));overscroll-behavior-y:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
a{color:inherit}
input,textarea,select{font:inherit;color:inherit}
.c{font-stretch:75%}.cc{font-stretch:62%}.w{font-stretch:112%}
.mono{font-family:var(--m)}
.up{text-transform:uppercase;letter-spacing:.06em}
.hide{display:none!important}

/* ---------- Station sign header ---------- */
.sign{position:sticky;top:0;z-index:1040;background:var(--sign);color:var(--signText);padding:calc(8px + var(--safeT)) 14px 10px}
.sign:before{content:"";position:absolute;left:0;right:0;top:calc(var(--safeT) + 3px);height:3px;background:var(--signText);opacity:.95}
.signrow{display:flex;align-items:center;gap:10px;margin-top:6px}
.signrow .tt{flex:1;min-width:0}
.sign h1{margin:0;font-size:25px;font-weight:850;font-stretch:72%;letter-spacing:-.01em;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sign .sub{font-size:11.5px;font-weight:600;opacity:.75;letter-spacing:.08em;text-transform:uppercase;margin-top:4px}
.bul{display:inline-grid;place-items:center;border-radius:50%;font-weight:800;font-stretch:90%;flex:none;line-height:1}
.sign .logo{width:38px;height:38px;background:var(--red);color:#fff;font-size:15px;font-stretch:100%}
.cd{text-align:right;flex:none}
.cd b{display:block;font-family:var(--m);font-size:22px;line-height:1}
.cd span{font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;opacity:.7}
.sbtns{display:flex;gap:6px;margin-top:9px;align-items:center}
.pill{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:14px;border:1px solid rgba(242,238,228,.28);font-size:12.5px;font-weight:650;white-space:nowrap}
.pill .dot{width:16px;height:16px;font-size:10px}
.pill.me{background:var(--signText);color:var(--ink);border-color:var(--signText)}
.pill.warn{border-color:var(--yellow);color:var(--yellow)}
.sbtns .sp{flex:1}
#net{background:var(--yellow);color:#111;font-size:12.5px;font-weight:700;text-align:center;padding:5px 10px}

/* ---------- Bottom tabs ---------- */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:1050;background:var(--sign);color:var(--signText);display:grid;grid-template-columns:repeat(5,1fr);padding:6px 4px calc(6px + var(--safeB))}
nav.tabs button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;opacity:.55;position:relative;padding:2px 0}
nav.tabs button .ti{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:850;background:#2a2a2a;color:#fff}
nav.tabs button.on{opacity:1}
nav.tabs button.on .ti{background:var(--signText);color:var(--ink)}
nav.tabs .badge{position:absolute;top:0;left:calc(50% + 8px);min-width:16px;height:16px;border-radius:8px;background:var(--red);color:#fff;font-size:10px;display:grid;place-items:center;padding:0 4px;font-family:var(--m)}

main{padding:0 0 20px}
.wrap{padding:0 14px}
h2.sec{margin:22px 14px 10px;font-size:13px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;display:flex;align-items:center;gap:8px}
h2.sec:after{content:"";flex:1;height:2px;background:var(--ink)}
h2.sec small{font-family:var(--m);font-size:11px;letter-spacing:0;color:var(--mute);font-weight:500}

/* ---------- Day strip (stations) ---------- */
.strip{position:relative;display:flex;overflow-x:auto;scrollbar-width:none;padding:16px 10px 6px;background:var(--paper2);border-bottom:1px solid var(--line)}
.strip::-webkit-scrollbar{display:none}
.strip .rail{position:absolute;left:30px;right:30px;top:28px;height:5px;background:var(--ink)}
.st{position:relative;flex:1 0 54px;display:flex;flex-direction:column;align-items:center;gap:4px;z-index:1}
.st i{width:20px;height:20px;border-radius:50%;background:var(--card);border:4px solid var(--ink)}
.st.on i{background:var(--day);border-color:var(--ink);transform:scale(1.25)}
.st.today i:after{content:"";display:block;width:6px;height:6px;margin:3px auto;border-radius:50%;background:var(--ink)}
.st b{font-size:17px;font-weight:850;font-stretch:80%;line-height:1}
.st span{font-size:9.5px;font-weight:700;letter-spacing:.08em;color:var(--mute)}
.st.on b{color:var(--ink)}
.st em{position:absolute;top:-12px;font-style:normal;font-size:9px;font-weight:800;letter-spacing:.06em;color:var(--red);text-transform:uppercase;white-space:nowrap}

/* ---------- Day header ---------- */
.dayh{display:flex;align-items:flex-end;gap:12px;padding:16px 14px 6px}
.dayh .big{width:54px;height:54px;font-size:22px;background:var(--day);color:var(--dayT);border:3px solid var(--ink)}
.dayh h3{margin:0;font-size:24px;font-weight:850;font-stretch:72%;line-height:1}
.dayh p{margin:3px 0 0;color:var(--mute);font-size:12.5px}
.dact{display:flex;gap:6px;padding:4px 14px 2px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;border:1.5px solid var(--ink);border-radius:3px;font-weight:750;font-size:13px;background:var(--card);text-decoration:none;white-space:nowrap}
.btn.k{background:var(--ink);color:var(--paper)}
.btn.r{background:var(--red);border-color:var(--red);color:#fff}
.btn.g{background:var(--green);border-color:var(--green);color:#fff}
.btn.s{height:28px;padding:0 9px;font-size:12px}
.btn[disabled]{opacity:.4}

/* ---------- Timeline (line map) ---------- */
.line{position:relative;margin:10px 14px 0;padding-left:0}
.stop,.leg,.gap{position:relative;display:grid;grid-template-columns:50px 26px 1fr;align-items:start}
.line:before{content:"";position:absolute;left:61px;top:10px;bottom:10px;width:8px;background:var(--day);border-left:1.5px solid rgba(0,0,0,.25);border-right:1.5px solid rgba(0,0,0,.25)}
.stop .tm{font-family:var(--m);font-size:13.5px;font-weight:700;padding-top:9px;text-align:right;padding-right:8px}
.stop .nd{position:relative;z-index:1;width:22px;height:22px;margin:7px 0 0 4px;border-radius:50%;background:#fff;border:4px solid var(--ink)}
.stop.exp .nd{background:var(--ink)}
.stop.ok .nd{background:var(--green);border-color:var(--ink)}
.bw{position:relative}.more{position:absolute;right:6px;top:8px;z-index:2;width:30px;height:30px;border-radius:50%;font-size:18px;font-weight:900;line-height:1;background:var(--paper2);color:var(--ink)}
.stop .bx{padding-right:40px!important;margin:3px 0 4px 6px;background:var(--card);border:1.5px solid var(--ink);border-radius:3px;padding:8px 10px 9px;display:flex;gap:10px;align-items:flex-start;text-align:left;width:calc(100% - 6px)}
.stop .bx .ph{width:48px;height:48px;flex:none;border-radius:2px;background:#ddd center/cover}
.bx .tx{flex:1;min-width:0}
.bx .tx b{display:block;font-size:15.5px;font-weight:780;font-stretch:88%;line-height:1.15}
.bx .tx small{display:block;color:var(--mute);font-size:12px;margin-top:2px}
.tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
.tag{font-size:10.5px;font-weight:750;letter-spacing:.04em;text-transform:uppercase;padding:2px 6px;border-radius:2px;background:var(--paper2);color:var(--ink2);white-space:nowrap}
.tag.ok{background:var(--green);color:#fff}.tag.need{background:var(--orange);color:#fff}.tag.both{background:#d9f2df;color:#0b5a26}
.tag.urg{background:var(--red);color:#fff}.tag.ar{background:#ddd;color:#555}.tag.by{background:#e6ecfa;color:var(--blue)}.tag.taste{background:#fff1c2;color:#7a5a00}
.leg{min-height:26px;color:var(--mute);font-size:12px}
.leg .lx{grid-column:3;margin-left:8px;padding:3px 0 5px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.leg a{text-decoration:none;border-bottom:1px dotted var(--mute);color:var(--ink2);font-weight:650}
.gap .gx{grid-column:3;margin:2px 0 6px 6px;border:1.5px dashed var(--line2);border-radius:3px;padding:8px 10px;font-size:13px;background:rgba(255,255,255,.35)}
.gap .gx b{font-weight:780}
.gap .gx .sg{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.sgb{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;border:1px solid var(--line2);border-radius:14px;padding:4px 9px;background:var(--card)}
.sgb .bul{width:16px;height:16px;font-size:9px}
.endst{display:grid;grid-template-columns:50px 26px 1fr;align-items:center;margin-top:2px}
.endst .nd{width:22px;height:22px;margin-left:4px;border-radius:3px;background:var(--ink);position:relative;z-index:1}
.endst span{margin-left:8px;font-size:12px;color:var(--mute);font-weight:650}
.empty{margin:16px 14px;padding:16px;border:1.5px dashed var(--line2);border-radius:3px;color:var(--mute);text-align:center;font-size:13.5px}

/* ---------- Alerts / banners ---------- */
.alert{margin:12px 14px 0;background:var(--ink);color:var(--paper);border-radius:3px;padding:10px 12px;display:flex;gap:10px;align-items:flex-start;text-align:left;width:calc(100% - 28px)}
.alert .ai{font-size:18px;line-height:1}
.alert b{display:block;font-size:13.5px;font-weight:800}
.alert span{font-size:12.5px;opacity:.85}
.alert.y{background:var(--yellow);color:#111}

/* ---------- Rows / lists ---------- */
.list{margin:0 14px;border-top:1.5px solid var(--ink)}
.row{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);text-align:left;width:100%}
.row .bul{width:30px;height:30px;font-size:14px}
.row .ph{width:56px;height:56px;flex:none;border-radius:2px;background:#ccc center/cover;position:relative}
.row .ph .bul{position:absolute;right:-6px;bottom:-6px;width:22px;height:22px;font-size:11px;border:2px solid var(--paper)}
.row .tx{flex:1;min-width:0}
.row .tx b{display:block;font-size:15px;font-weight:760;font-stretch:88%;line-height:1.15}
.row .tx small{display:block;color:var(--mute);font-size:12px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .pr{font-family:var(--m);font-size:11.5px;font-weight:700;color:var(--ink2);margin-top:3px}
.vq{display:flex;gap:4px;flex:none}
.vq button{width:34px;height:34px;border:1.5px solid var(--line2);border-radius:3px;font-size:15px;background:var(--card);display:grid;place-items:center}
.vq button.on.up{background:var(--green);border-color:var(--green)}
.vq button.on.dn{background:#bbb;border-color:#999}
.who{display:flex;gap:2px;margin-top:4px}
.who i{font-style:normal;font-size:10px;font-weight:800;padding:1px 5px;border-radius:2px;background:var(--paper2);color:var(--mute)}
.who i.l{background:#d9f2df;color:#0b5a26}.who i.d{background:#eee;color:#999;text-decoration:line-through}
.chips{display:flex;gap:6px;overflow-x:auto;padding:12px 14px 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:30px;padding:0 11px;border:1.5px solid var(--ink);border-radius:15px;font-size:12.5px;font-weight:750;background:var(--card);white-space:nowrap}
.chip.on{background:var(--ink);color:var(--paper)}
.search{margin:12px 14px 0;display:flex;align-items:center;gap:8px;border:1.5px solid var(--ink);border-radius:3px;background:var(--card);padding:0 10px;height:40px}
.search input{flex:1;border:0;background:none;outline:none;font-size:15px}
details.grp{margin:0 0 4px}
details.grp>summary{list-style:none;display:flex;align-items:center;gap:10px;padding:14px 14px 10px;cursor:pointer}
details.grp>summary::-webkit-details-marker{display:none}
details.grp>summary .bul{width:30px;height:30px;font-size:14px}
details.grp>summary b{flex:1;font-size:18px;font-weight:850;font-stretch:75%;text-transform:uppercase;letter-spacing:.01em}
details.grp>summary small{font-family:var(--m);font-size:11.5px;color:var(--mute)}
details.grp>summary:after{content:"+";font-weight:800;font-size:20px;width:20px;text-align:center}
details.grp[open]>summary:after{content:"–"}

/* ---------- Progress ---------- */
.prog{margin:14px 14px 4px;border:1.5px solid var(--ink);border-radius:3px;background:var(--card);padding:10px 12px}
.prog .bar{height:10px;background:var(--paper2);border-radius:2px;overflow:hidden;margin-top:7px}
.prog .bar i{display:block;height:100%;background:var(--green)}
.prog b{font-size:15px;font-weight:800}
.prog small{color:var(--mute);font-size:12px}
.rv{border-bottom:1px solid var(--line);padding:11px 0}
.rv .top{display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%}
.rv .bk{font-size:12.5px;color:var(--ink2);margin:6px 0 0 40px;padding:6px 8px;background:var(--paper2);border-left:3px solid var(--orange)}
.rv .acts{display:flex;gap:6px;margin:8px 0 0 40px;flex-wrap:wrap}

/* ---------- Map ---------- */
#mapwrap{position:relative}
#lmap{height:calc(100vh - 230px - var(--safeT) - var(--safeB));min-height:360px;background:#e5e0d2}
.leaflet-container{font-family:var(--f)}
.mk{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:850;font-size:12px;border:2.5px solid #121212;box-shadow:0 1px 3px rgba(0,0,0,.35)}
.mk.n{border-radius:4px}
.mk.me{background:#1a73e8;border-color:#fff;width:18px;height:18px}
.mk.ht{background:#121212;color:#fff;border-color:#fff;border-radius:4px}
.leaflet-popup-content-wrapper{border-radius:3px;border:1.5px solid #121212;box-shadow:none}
.leaflet-popup-content{margin:10px 12px;font-size:13px}
.pp b{display:block;font-size:15px;font-weight:800;font-stretch:85%}
.pp small{color:var(--mute)}
.pp .dl{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.pp .dl a,.pp .dl button{font-size:12px;font-weight:750;border:1.5px solid #121212;border-radius:3px;padding:4px 7px;text-decoration:none;background:#fff}
.mtools{position:absolute;right:10px;top:10px;z-index:900;display:flex;flex-direction:column;gap:6px}
.mtools button{width:40px;height:40px;border-radius:3px;background:var(--card);border:1.5px solid var(--ink);font-size:17px}
.legend{display:flex;gap:10px;flex-wrap:wrap;padding:8px 14px;font-size:11.5px;color:var(--mute)}
.legend span{display:inline-flex;align-items:center;gap:4px}
.legend .bul{width:14px;height:14px;font-size:8px}

/* ---------- Chat ---------- */
.chat{padding:10px 14px 120px}
.msg{max-width:86%;margin:8px 0;padding:9px 11px;border-radius:3px;font-size:14.5px;white-space:pre-wrap;word-wrap:break-word}
.msg .mh{display:block;font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;margin-bottom:3px;opacity:.7}
.msg.me{margin-left:auto;background:var(--ink);color:var(--paper)}
.msg.ot{background:var(--card);border:1.5px solid var(--ink)}
.msg.cl{background:#fff8de;border:1.5px solid #d9b500;max-width:94%}
.msg .pend{font-size:11px;opacity:.7}
.composer{position:fixed;left:0;right:0;bottom:calc(62px + var(--safeB));z-index:1045;background:var(--paper);border-top:1.5px solid var(--ink);padding:8px 10px;display:flex;gap:8px}
.composer textarea{flex:1;resize:none;height:42px;max-height:120px;border:1.5px solid var(--ink);border-radius:3px;padding:10px;background:var(--card);font-size:15px;outline:none}
.hint{font-size:12px;color:var(--mute);padding:8px 14px 0}

/* ---------- Sheet ---------- */
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:1090;opacity:0;pointer-events:none;transition:opacity .2s}
#scrim.on{opacity:1;pointer-events:auto}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:1100;max-height:92vh;background:var(--paper);border-top:4px solid var(--ink);border-radius:8px 8px 0 0;transform:translateY(105%);transition:transform .25s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;padding-bottom:var(--safeB)}
#sheet.on{transform:none}
#sheet .grab{display:flex;justify-content:space-between;align-items:center;padding:8px 12px 6px}
#sheet .grab i{width:40px;height:5px;border-radius:3px;background:var(--line2);margin:0 auto}
#sheet .x{width:34px;height:34px;border:1.5px solid var(--ink);border-radius:50%;font-size:16px;font-weight:800;flex:none}
#sbody{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 0 calc(40px + var(--safeB))}
.gal{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:2px;height:230px;scrollbar-width:none;background:#222}
.gal::-webkit-scrollbar{display:none}
.gal img{flex:0 0 100%;width:100%;height:100%;object-fit:cover;scroll-snap-align:start}
.galc{font-family:var(--m);font-size:11px;color:var(--mute);padding:4px 14px 0}
.hero{display:flex;gap:12px;align-items:center;padding:6px 14px 4px}
.hero .bul{width:52px;height:52px;font-size:22px;border:3px solid var(--ink)}
.dt{padding:8px 14px 0}
.dt .cat{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
.dt h3{margin:3px 0 0;font-size:26px;font-weight:850;font-stretch:72%;line-height:1.02}
.dt .sb{color:var(--ink2);font-size:13.5px;margin-top:4px}
.dt p{font-size:14.5px;line-height:1.45;margin:10px 0 0}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:0;margin:12px 14px 0;border-top:1.5px solid var(--ink)}
.facts div{padding:8px 8px 8px 0;border-bottom:1px solid var(--line);font-size:13px}
.facts div.wide{grid-column:1/-1}
.facts small{display:block;font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.facts .mono{font-size:13px}
.vbig{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 14px 0}
.vbig button{height:46px;border:1.5px solid var(--ink);border-radius:3px;font-weight:800;font-size:15px;background:var(--card)}
.vbig button.on.up{background:var(--green);color:#fff;border-color:var(--green)}
.vbig button.on.dn{background:#777;color:#fff;border-color:#777}
.ov{margin:6px 14px 0;font-size:12.5px;color:var(--mute)}
.acts2{display:flex;flex-wrap:wrap;gap:6px;margin:12px 14px 0}
.plbox{margin:14px 14px 0;padding:10px;border:1.5px solid var(--ink);border-radius:3px;background:var(--card);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.plbox label{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);width:100%}
.plbox select,.plbox input{height:36px;border:1.5px solid var(--ink);border-radius:3px;background:#fff;padding:0 8px;font-size:14px}
.notes{margin:16px 14px 0}
.notes h4{margin:0 0 6px;font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase}
.note{display:flex;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.note .av{width:24px;height:24px;font-size:11px;color:#fff;flex:none}
.note .nt{flex:1;font-size:14px;white-space:pre-wrap}
.note .nt small{display:block;color:var(--mute);font-size:11px;margin-top:2px}

const $=s=>document.querySelector(s);

function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,v)}catch(e){return null}}
const qs=new URLSearchParams(location.search);

if(!["hat","rez","kesfet","harita","sohbet"].includes(tab))tab="hat";
let selDay=null,kFilter="all",kQuery="",mapDay=ls("nyc_mday")||"all",sheetFor=null;

if(!seen.k){seen.k=+(ls("nyc_seen")||0)||Date.now();seen.c=+(ls("nyc_chat")||0)||Date.now();ls("nyc_seen2",JSON.stringify(seen))}

/* ---------- data ---------- */
async function rpc(fn,args){
  const r=await fetch(SB+"/rest/v1/rpc/"+fn,{method:"POST",headers:{apikey:KEY,Authorization:"Bearer "+KEY,"Content-Type":"application/json"},body:JSON.stringify(args)});
  if(!r.ok){const e=new Error("http "+r.status);e.http=r.status;throw e}
  const t=await r.text();return t?JSON.parse(t):null;
}
function norm(s){
  S=Object.assign({items:[],votes:[],plan:{},ptime:{},booked:{},archive:{},notes:[],expenses:[],chat:[],meta:{}},s||{});
  for(const k of["plan","ptime","booked","archive","meta"])S[k]=S[k]||{};
  I={};for(const it of S.items)I[it.id]=it;
  V={necmi:{},ahmet:{}};for(const v of S.votes)if(V[v.p])V[v.p][v.i]=v.v;
}
function saveOB(){ls("nyc_ob",JSON.stringify(OB))}
let flushing=false;
async function flush(){
  if(flushing||!OB.length)return;flushing=true;
  try{while(OB.length){
    try{await rpc(OB[0][0],OB[0][1])}catch(e){if(e.http){toast("Kaydedilemedi ("+e.http+")");}else{break}}
    OB.shift();saveOB();
  }}finally{flushing=false;netState()}
}
function send(fn,args){OB.push([fn,Object.assign({k:K},args)]);saveOB();netState();flush().then(()=>{if(!OB.length)setTimeout(load,400)})}
let loading=false;
async function load(){
  if(!K||loading)return;loading=true;
  try{
    await flush();
    if(OB.length){loading=false;return}
    const s=await rpc("trip_state",{k:K});
    ls("nyc_state",JSON.stringify(s));norm(s);
    online(true);detectNew();renderSoft();
  }catch(e){
    if(e.http===400||e.http===401){ls("nyc_k",null);K=null;gate();}
    else online(false);
  }finally{loading=false}
}
let isOn=navigator.onLine;
function online(v){isOn=v;netState()}
function netState(){
  const n=$("#net");
  if(!isOn||!navigator.onLine){n.textContent="📴 Çevrimdışısın: kayıtlı son hâli görüyorsun"+(OB.length?" · "+OB.length+" değişiklik bağlanınca gönderilecek":"");n.classList.remove("hide")}
  else if(OB.length){n.textContent="⏳ "+OB.length+" değişiklik gönderiliyor…";n.classList.remove("hide")}
  else n.classList.add("hide");
}
addEventListener("online",()=>{isOn=true;load()});addEventListener("offline",()=>online(false));

/* ---------- helpers ---------- */
const vote=(p,id)=>(V[p]||{})[id]||0;
const mv=id=>vote(ME,id),ov=id=>vote(OTHER(),id);
const both=id=>vote("necmi",id)===1&&vote("ahmet",id)===1;
const anyLike=id=>vote("necmi",id)===1||vote("ahmet",id)===1;
function isDate(s){return /^\d{4}-\d\d-\d\d$/.test(s||"")}
function dayOf(it){const p=S.plan[it.id];if(p==="-")return null;return p||(isDate(it.when)?it.when:null)}
function timeOf(it){return S.ptime[it.id]||it.time||""}
function tmin(t){const m=/^(\d{1,2}):(\d\d)/.exec(t||"");return m?(+m[1])*60+(+m[2]):null}
function durMin(it){const d=it.dur;if(typeof d==="number")return d;const s=String(d||"");let m=/(\d+(?:[.,]\d+)?)\s*s/.exec(s);if(m)return Math.round(parseFloat(m[1].replace(",","."))*60);m=/(\d+)\s*dk/.exec(s);if(m)return +m[1];return({otel:0,yemek:75,caz:120,broadway:165,sahne:120,muze:150,manzara:75,deneyim:90,ozel:180,ucus:60,alisveris:120})[it.cat]||90}
function needsBook(it){if(!it.book)return false;if(it.cat==="ucus")return false;return !/rezervasyon yok|gerekmez|gerek yok|^yok/i.test(it.book)}
function archInfo(it){
  if(S.booked[it.id])return null;
  const a=S.archive[it.id];if(a)return{r:a.r||"Arşive alındı",manual:true};
  if(it.grp){const b=S.items.find(x=>x.grp===it.grp&&x.id!==it.id&&S.booked[x.id]);if(b)return{r:b.title.split("·")[0].trim()+" alındı",auto:true}}
  if(vote("necmi",it.id)===-1&&vote("ahmet",it.id)===-1)return{r:"İkiniz de geçtiniz",auto:true};
  return null;
}
function grpChosen(g){return S.items.find(x=>x.grp===g&&(S.booked[x.id]||both(x.id)||(g!=="otel"&&(x.by==="necmi"||x.by==="ahmet"))))}
function isAlt(it){if(!it.grp||S.booked[it.id])return false;const c=grpChosen(it.grp);return !!(c&&c.id!==it.id)}
function score(it){return (vote("necmi",it.id)+vote("ahmet",it.id))*2+(both(it.id)?2:0)+(it.must?1.5:0)+(it.urgent?.5:0)+(S.booked[it.id]?5:0)}
function fmtDay(d,short){const x=DAYS.find(z=>z[0]===d);if(!x){if(!isDate(d))return d||"";const [y,m,g]=d.split("-");return (+g)+" "+AY[+m-1]}const g=+d.slice(8),m=+d.slice(5,7);return short?g+" "+AY[m-1].slice(0,3):g+" "+AY[m-1]+" "+x[2]}
function bul(cat,size){const C=CAT[cat]||CAT.deneyim;return `<span class="bul" style="background:${C.c};color:${C.t}${size?`;width:${size}px;height:${size}px`:""}">${C.l}</span>`}
function photo(it){return it.photos&&it.photos.length?it.photos[0]:null}
function hav(a,b){const R=6371,r=x=>x*Math.PI/180;const dl=r(b.lat-a.lat),dg=r(b.lng-a.lng);const h=Math.sin(dl/2)**2+Math.cos(r(a.lat))*Math.cos(r(b.lat))*Math.sin(dg/2)**2;return 2*R*Math.asin(Math.sqrt(h))}
const hasLL=it=>it&&typeof it.lat==="number"&&typeof it.lng==="number";
function legInfo(a,b){const km=hav(a,b)*1.3;return{km,walk:Math.max(1,Math.round(km*1000/80)),transit:Math.round(8+km*1000/330),car:Math.round(5+km*1000/250)}}
function gm(o,d,mode){const dst=hasLL(d)?d.lat+","+d.lng:encodeURIComponent((d.title||"")+" "+(d.addr||"")+" New York");return "https://www.google.com/maps/dir/?api=1"+(o&&hasLL(o)?"&origin="+o.lat+","+o.lng:"")+"&destination="+dst+"&travelmode="+mode}
function gsearch(it){return "https://www.google.com/maps/search/?api=1&query="+encodeURIComponent((it.title||"").split("·")[0]+" "+(it.addr||"")+" New York")}
function km(x){return x<1?Math.round(x*1000)+" m":x.toFixed(1).replace(".",",")+" km"}
function hotel(){
  const hs=S.items.filter(x=>x.cat==="otel");
  return hs.find(h=>S.booked[h.id])||hs.find(h=>both(h.id))||null;
}
function calUrl(it){
  const d=dayOf(it);if(!d)return null;const t=timeOf(it)||"19:00";const m=tmin(t);
  const st=d.replace(/-/g,"")+"T"+t.replace(":","")+"00";const em=m+durMin(it);const ed=new Date(Date.UTC(+d.slice(0,4),+d.slice(5,7)-1,+d.slice(8),0,em));
  const e2=ed.toISOString().replace(/[-:]/g,"").slice(0,15);
  return "https://calendar.google.com/calendar/render?action=TEMPLATE&ctz=America/New_York&text="+encodeURIComponent(it.title)+"&dates="+st+"/"+e2+"&location="+encodeURIComponent(it.addr||it.area||"")+"&details="+encodeURIComponent((it.desc||"").slice(0,600))}
function nyNow(){const s=new Date().toLocaleString("en-CA",{timeZone:"America/New_York",hour12:false});return{d:s.slice(0,10),t:s.slice(12,17)}}
function ago(ts){const s=(Date.now()-ts)/1000;if(s<60)return"şimdi";if(s<3600)return Math.floor(s/60)+" dk";if(s<86400)return Math.floor(s/3600)+" sa";return Math.floor(s/86400)+" g"}
function toast(t){const n=$("#toast");n.textContent=t;n.classList.add("on");clearTimeout(n._t);n._t=setTimeout(()=>n.classList.remove("on"),4200)}

/* ---------- actions ---------- */
function doVote(i,v){const cur=mv(i);const nv=cur===v?0:v;V[ME][i]=nv;S.votes=S.votes.filter(x=>!(x.p===ME&&x.i===i));if(nv)S.votes.push({p:ME,i,v:nv});send("trip_vote",{p:ME,i,val:nv});if(nv===1&&ov(i)===1)toast("💚 İkiniz de beğendiniz: "+I[i].title);renderSoft()}
function doBook(i){const on=!S.booked[i];if(on)S.booked[i]=ME;else delete S.booked[i];send("trip_booked",{i,p:ME,b:on});
  if(on){const it=I[i];let n=0;if(it.grp)n=S.items.filter(x=>x.grp===it.grp&&x.id!==i&&!S.booked[x.id]).length;toast("✓ Alındı olarak işaretlendi"+(n?" · aynı gruptaki "+n+" seçenek arşive taşındı":""));renderSoft();setTimeout(()=>openExpense({item:i}),350);return}
  renderSoft()}
function doArchive(i,on){if(on)S.archive[i]={by:ME,r:"Arşive alındı"};else delete S.archive[i];send("trip_archive",{i,p:ME,a:on,r:on?"Arşive alındı":null});toast(on?"Arşive alındı":"Arşivden çıkarıldı");renderSoft()}
function doPlan(i,d,t){const it=I[i];if(!d&&it&&isDate(it.when))d="-";if(d){S.plan[i]=d;if(t)S.ptime[i]=t}else{delete S.plan[i];delete S.ptime[i]}send("trip_plan2",{i,d:d||"",t:t||null,p:ME});renderSoft()}
function unplan(i){doPlan(i,"");toast("Programdan çıkarıldı")}
function replaceStop(oldId,newId){const o=I[oldId];const d=dayOf(o),t=timeOf(o);doPlan(newId,d,t);doPlan(oldId,"");toast("⇄ "+I[newId].title.split("·")[0].trim()+" ile değiştirildi");closeSheet()}
async function geocode(q){try{const r=await fetch("https://nominatim.openstreetmap.org/search?format=json&limit=1&viewbox=-74.26,40.92,-73.70,40.49&bounded=1&q="+encodeURIComponent(q));const j=await r.json();if(j&&j[0])return{lat:+j[0].lat,lng:+j[0].lon}}catch(e){}return null}
async function addCustom(d){
  const title=$("#ctitle").value.trim();if(!title)return toast("Bir başlık yazın");
  const t=$("#ctime").value||null,cat=$("#ccat").value,addr=$("#caddr").value.trim()||null;
  const b=$("#cadd");b.disabled=true;b.textContent="Ekleniyor…";
  let ll=null;if(addr&&navigator.onLine)ll=await geocode(addr);
  const tmp="u-tmp"+Date.now();const it={id:tmp,cat,title,addr,time:t,by:ME,custom:true,addedAt:Date.now()};if(ll){it.lat=ll.lat;it.lng=ll.lng}
  S.items.push(it);I[tmp]=it;S.plan[tmp]=d;if(t)S.ptime[tmp]=t;
  send("trip_add_item",{p:ME,title,cat,d,t,addr,lat:ll?ll.lat:null,lng:ll?ll.lng:null,descr:null});
  closeSheet();renderSoft();toast("＋ "+title+" programa eklendi"+(addr&&!ll?" (adres haritada bulunamadı)":""));
}
function doNote(i,t){t=(t||"").trim();if(!t)return;S.notes.push({id:-Date.now(),i,p:ME,t,ts:Date.now(),pend:1});send("trip_note",{i,p:ME,t,del:null});renderSoft()}
function delNote(nid){S.notes=S.notes.filter(n=>n.id!==nid);send("trip_note",{i:"",p:ME,t:"",del:nid});renderSoft()}
function doChat(t){t=(t||"").trim();if(!t)return;S.chat.push({id:-Date.now(),p:ME,role:"user",text:t,ts:Date.now(),pend:1});send("trip_chat",{p:ME,t});renderSoft();setTimeout(()=>scrollTo(0,document.body.scrollHeight),50)}

/* ---------- header / tabs ---------- */
function renderSign(){
  const start=Date.UTC(2026,11,25,15,55),now=Date.now();
  let cd;if(now<start){cd=`<div class="cd"><b>${Math.ceil((start-now)/864e5)}</b><span>gün kaldı</span></div>`}
  else{const n=nyNow();const x=DAYS.findIndex(z=>z[0]===n.d);cd=x>=0?`<div class="cd"><b>${x+1}/8</b><span>gün · NY ${n.t}</span></div>`:`<div class="cd"><b>✓</b><span>bitti</span></div>`}
  const me=PPL[ME]||{n:"?",c:"#666",l:"?"},ot=PPL[OTHER()];
  const otLikes=Object.values(V[OTHER()]||{}).filter(v=>v===1).length,meLikes=Object.values(V[ME]||{}).filter(v=>v===1).length;
  const push=ls("nyc_push")==="1";
  $("#sign").innerHTML=`<div class="signrow"><span class="bul logo">NY</span><div class="tt"><h1>Noel'den Yılbaşına</h1><div class="sub">25 Ara → 2 Oca · Necmi & Ahmet</div></div>${cd}</div>
  <div class="sbtns"><button class="pill me" id="pme"><span class="bul dot" style="background:${me.c};color:#fff">${me.l}</span>${me.n} · ${meLikes}👍</button><span class="pill"><span class="bul dot" style="background:${ot.c};color:#fff">${ot.l}</span>${ot.n} · ${otLikes}👍</span><span class="sp"></span>
  <button class="pill ${push?"":"warn"}" id="ppush">${push?"🔔":"🔕 Bildirim"}</button><button class="pill" id="pguide">ℹ Rehber</button></div>`;
  $("#pme").onclick=()=>{if(confirmSwitch())pickPerson()};
  $("#ppush").onclick=()=>push?openPushInfo():enablePush();
  $("#pguide").onclick=openGuide;
}
function confirmSwitch(){return true}
function renderTabs(){
  const b=badges();
  const T=[["hat","Hat","◉"],["rez","Rezerv·₺","✓"],["kesfet","Keşfet","★"],["harita","Harita","⌖"],["sohbet","Sohbet","✎"]];
  $("#tabs").innerHTML=T.map(([k,n,i])=>`<button data-t="${k}" class="${tab===k?"on":""}"><span class="ti">${i}</span>${n}${b[k]?`<span class="badge">${b[k]}</span>`:""}</button>`).join("");
  $("#tabs").querySelectorAll("button").forEach(x=>x.onclick=()=>go(x.dataset.t));
}
function go(t){if(tab===t){scrollTo({top:0,behavior:"smooth"});return}tab=t;ls("nyc_tab",t);history.replaceState(null,"",location.pathname+location.search+"#"+t);render();scrollTo(0,0);markSeen()}

/* ---------- new-item detection ---------- */
function badges(){
  if(!S)return{};
  const b={};

  let h=`<div class="prog"><b>${done.length} / ${total} rezervasyon tamam</b><br><small>Planda olan, beğendiğiniz ya da “kesin” işaretli ve bilet/rezervasyon gerektirenler. Aldığınızda ✓ işaretleyin; aynı gruptaki alternatifler kendiliğinden arşive geçer.</small><div class="bar"><i style="width:${total?Math.round(done.length/total*100):0}%"></i></div></div>`;

  const urgent=todo.filter(x=>x.urgent),dated=todo.filter(x=>!x.urgent&&dayOf(x)).sort((a,b)=>(dayOf(a)+timeOf(a)).localeCompare(dayOf(b)+timeOf(b))),other=todo.filter(x=>!x.urgent&&!dayOf(x));

/* ---------- KEŞFET ---------- */
function rKesfet(){
  const arch=S.items.filter(x=>archInfo(x));
  const F=[["all","Tümü"],["new","👀 Oy vermediklerim"],["both","💚 İkimiz"],["taste","🍴 Mutlaka ye"],["mine","👤 Benim bulduklarım"],["arch","🗄 Arşiv ("+arch.length+")"]];
  let h=`<div class="search">⌕<input id="kq" placeholder="Ara: caz, pizza, Tribeca…" value="${esc(kQuery)}"></div><div class="chips">${F.map(([k,n])=>`<button class="chip ${kFilter===k?"on":""}" data-kf="${k}">${n}</button>`).join("")}</div>`;
  const q=kQuery.trim().toLocaleLowerCase("tr");
  const pass=it=>{
    if(q&&!((it.title+" "+(it.area||"")+" "+(it.desc||"")+" "+(it.sub||"")).toLocaleLowerCase("tr").includes(q)))return false;
    const a=archInfo(it);
    if(kFilter==="arch")return !!a;
    if(a)return false;
    if(kFilter==="new")return !mv(it.id)&&it.cat!=="ucus";
    if(kFilter==="both")return both(it.id);
    if(kFilter==="taste")return !!it.taste;
    if(kFilter==="mine")return it.by===ME;
    return true;
  };
  const used=new Set();let any=false;
  for(const [k,n,cat,f] of GROUPS){
    const arr=S.items.filter(it=>!used.has(it.id)&&f(it)&&pass(it)).sort((a,b)=>score(b)-score(a)||((a.addedAt||0)-(b.addedAt||0)));
    S.items.filter(it=>f(it)).forEach(it=>used.add(it.id));
    if(!arr.length)continue;any=true;
    const open=q||kFilter!=="all"||ls("nyc_g_"+k)==="1"||(openGrp===k);
    h+=`<details class="grp" data-g="${k}" ${open?"open":""}><summary>${bul(cat,30)}<b>${n}</b><small>${arr.length}</small></summary><div class="list">${arr.map(rowHtml).join("")}</div></details>`;
  }
  if(!any)h+=`<div class="empty">Burada bir şey yok.</div>`;
  return h;
}
let openGrp=null;
function rowHtml(it){
  const ph=photo(it),a=archInfo(it),B=S.booked[it.id];
  const nv=vote("necmi",it.id),av=vote("ahmet",it.id);
  const wi=(p,v)=>`<i class="${v===1?"l":v===-1?"d":""}">${PPL[p].l}</i>`;
  return `<div class="row"><button style="display:flex;gap:10px;align-items:center;flex:1;min-width:0;text-align:left" data-open="${it.id}">${ph?`<span class="ph" style="background-image:url('${esc(ph)}')">${bul(it.cat)}</span>`:bul(it.cat)}<span class="tx"><b>${esc(it.title)}</b><small>${esc([it.sub,it.area].filter(Boolean).join(" · "))}</small>${it.rating?`<div class="pr" style="color:#7a5a00">★ ${esc(String(it.rating).replace(/ · \d.*$/,"").slice(0,40))}</div>`:""}${it.price?`<div class="pr">${esc(String(it.price).slice(0,70))}</div>`:""}<span class="tags">${B?`<span class="tag ok">✓ alındı</span>`:""}${a?`<span class="tag ar">${esc(a.r)}</span>`:""}${!a&&isAlt(it)?`<span class="tag ar">alternatif</span>`:""}${dayOf(it)&&it.cat!=="otel"?`<span class="tag">${fmtDay(dayOf(it),1)}${timeOf(it)?" "+esc(timeOf(it)):""}</span>`:""}${it.urgent&&!B?`<span class="tag urg">acil</span>`:""}${it.size?`<span class="tag">📐 ${esc(it.size.split(" ")[0])} m²</span>`:""}${it.by&&it.by!=="claude"?`<span class="tag by">${PPL[it.by]?PPL[it.by].n:""} buldu</span>`:""}${(it.addedAt||0)>(seen.k||0)?`<span class="tag urg">yeni</span>`:""}</span></span></button>
  <div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px"><div class="vq"><button class="${mv(it.id)===1?"on up":""}" data-v="${it.id}|1" aria-label="Beğendim">👍</button><button class="${mv(it.id)===-1?"on dn":""}" data-v="${it.id}|-1" aria-label="Geç">👎</button></div><div class="who">${wi("necmi",nv)}${wi("ahmet",av)}</div></div></div>`;
}

function initMap(){

  if(LM){LM.remove();LM=null}

function drawMap(fit){

function locate(){

  const it=I[i];const d=dayOf(it),t=timeOf(it);
  const pts=it;const cands=S.items.filter(x=>x.id!==i&&!dayOf(x)&&!archInfo(x)&&x.cat!=="otel"&&x.cat!=="ucus")
    .map(x=>({x,s:(x.cat===it.cat?3:0)+(both(x.id)?3:anyLike(x.id)?1.5:0)+(x.grp&&x.grp===it.grp?4:0)-(hasLL(x)&&hasLL(it)?hav(x,it)/2:1)}))
    .sort((a,b)=>b.s-a.s).slice(0,12);
  return `<div class="dt"><div class="cat">Durağı düzenle · ${fmtDay(d,1)} ${esc(t)}</div><h3>${esc(it.title)}</h3></div>
  <div class="plbox"><label>Saat / gün</label><select id="sd">${DAYS.map(z=>`<option value="${z[0]}" ${d===z[0]?"selected":""}>${fmtDay(z[0])}</option>`).join("")}</select><input id="st" type="time" value="${esc(t)}" step="900"><button class="btn k s" id="ssave">Kaydet</button></div>
  <div class="acts2"><button class="btn s" data-open="${i}">Detayı aç</button><button class="btn s r" id="srem">✕ Programdan çıkar</button></div>
  <h2 class="sec">⇄ Yerine bunu koy<small>aynı gün ve saat</small></h2><div class="list pick">${cands.map(({x})=>`<div class="row">${bul(x.cat)}<span class="tx"><b>${esc(x.title)}</b><small>${esc(x.area||"")}${both(x.id)?" · 💚":anyLike(x.id)?" · 👍":""}${hasLL(x)&&hasLL(it)?" · "+km(hav(x,it)*1.3)+" uzakta":""}</small></span><button class="btn s k" data-rep="${x.id}">⇄</button></div>`).join("")}</div>`;
}
function openStop(i){openSheet(stopSheet(i),"stop:"+i);
  $("#ssave").onclick=()=>{doPlan(i,$("#sd").value,$("#st").value);toast("✓ "+fmtDay($("#sd").value,1)+" "+$("#st").value+" olarak kaydedildi");closeSheet()};
  $("#srem").onclick=()=>{unplan(i);closeSheet()};
  $("#sbody").querySelectorAll("[data-rep]").forEach(b=>b.onclick=()=>replaceStop(i,b.dataset.rep));
}
function guideSheet(){
  const G=S.meta.guide||[];
  const push=ls("nyc_push")==="1";
  const sw="serviceWorker" in navigator&&navigator.serviceWorker.controller;
  return `<div class="dt"><div class="cat">Rehber</div><h3>Dikkat edilecekler</h3><p style="color:var(--mute);font-size:13px">Claude bu listeyi her sabah güncel tutar.</p></div><div class="gd">${G.map((g,i)=>`<details ${i<2?"open":""}><summary><span class="ic">${esc(g.i||"•")}</span>${esc(g.t)}</summary><ul>${(g.items||[]).map(x=>`<li>${esc(x)}</li>`).join("")}</ul></details>`).join("")}
  <details open><summary><span class="ic">📱</span>Bu uygulama</summary><ul>
  <li>${sw?"✓ Çevrimdışı hazır: internet yokken de son hâli açılır; gezdiğiniz harita bölgeleri ve fotoğraflar telefonda saklanır.":"Çevrimdışı mod bir sonraki açılışta hazır olur."}</li>
  <li>${push?"✓ Bu telefonda bildirimler açık.":"Bildirimler kapalı: üstteki 🔕 Bildirim düğmesine basın. iPhone'da önce uygulamayı ana ekrana ekleyip oradan açmanız gerekir (iOS 16.4+)."}</li>
  <li>Oylar, notlar ve ✓ işaretleri internet yokken de kaydedilir; bağlanınca gönderilir.</li>
  <li><button class="btn s" id="dlmap">⬇ Manhattan haritasını çevrimdışı için indir</button></li>
  </ul></details></div>`;
}
function openGuide(){openSheet(guideSheet(),"guide");const b=$("#dlmap");if(b)b.onclick=prefetchTiles}
function bindSheet(){
  const sb=$("#sbody");
  sb.querySelectorAll("[data-v]").forEach(b=>b.onclick=()=>{const [i,v]=b.dataset.v.split("|");doVote(i,+v)});
  sb.querySelectorAll("[data-book]").forEach(b=>b.onclick=()=>doBook(b.dataset.book));
  sb.querySelectorAll("[data-arch]").forEach(b=>b.onclick=()=>{const [i,a]=b.dataset.arch.split("|");doArchive(i,a==="1")});
  sb.querySelectorAll("[data-delnote]").forEach(b=>b.onclick=()=>delNote(+b.dataset.delnote));
  sb.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>{const pre=b.dataset.preday;openItem(b.dataset.open);if(pre){const s=$("#pd");if(s&&!s.value){s.value=pre}}});
  const ps=$("#psave");if(ps)ps.onclick=()=>{const i=sheetFor.slice(5);const d=$("#pd").value,t=$("#pt").value;doPlan(i,d,t);toast(d?"📅 "+fmtDay(d,1)+(t?" "+t:"")+" programına eklendi":"Programdan çıkarıldı")};
  const ns=$("#nsend");if(ns)ns.onclick=()=>{const t=$("#nin").value;const i=ns.dataset.ni||(sheetFor||"").replace(/^item:/,"");doNote(i,t);$("#nin").value=""};
  const dl=$("#dlmap");if(dl)dl.onclick=prefetchTiles;
  sb.querySelectorAll("[data-addto]").forEach(b=>b.onclick=()=>{const [i,d]=b.dataset.addto.split("|");const t=($("#at")||{}).value||"";doPlan(i,d,t);b.textContent="✓";b.disabled=true;toast("＋ "+I[i].title.split("·")[0].trim()+" · "+fmtDay(d,1)+" "+t)});
  const ca=$("#cadd");if(ca)ca.onclick=()=>addCustom(ca.dataset.cd);
}
async function prefetchTiles(){
  // Manhattan (Battery → Central Park North) + DUMBO, zoom 12-15
  const box={n:40.80,s:40.695,w:-74.025,e:-73.935};
  const t2=(lat,lng,z)=>{const n=2**z;const x=Math.floor((lng+180)/360*n);const r=lat*Math.PI/180;const y=Math.floor((1-Math.log(Math.tan(r)+1/Math.cos(r))/Math.PI)/2*n);return[x,y]};
  const urls=[];for(let z=12;z<=15;z++){const [x1,y1]=t2(box.n,box.w,z),[x2,y2]=t2(box.s,box.e,z);for(let x=x1;x<=x2;x++)for(let y=y1;y<=y2;y++)urls.push(`https://tile.openstreetmap.org/${z}/${x}/${y}.png`)}
  toast("⬇ "+urls.length+" harita karosu indiriliyor…");let ok=0;
  for(let i=0;i<urls.length;i+=6){await Promise.all(urls.slice(i,i+6).map(u=>fetch(u,{mode:"no-cors"}).then(()=>ok++).catch(()=>{})));await new Promise(r=>setTimeout(r,120))}
  toast("✓ Harita çevrimdışı için hazır ("+ok+" karo)");
}

/* ---------- push ---------- */
function b64u(s){const p="=".repeat((4-s.length%4)%4);const b=atob((s+p).replace(/-/g,"+").replace(/_/g,"/"));return Uint8Array.from([...b].map(c=>c.charCodeAt(0)))}
async function enablePush(){
  const standalone=matchMedia("(display-mode: standalone)").matches||navigator.standalone;
  if(!("serviceWorker" in navigator)||!("PushManager" in window)||!("Notification" in window)){
    toast(/iPhone|iPad/.test(navigator.userAgent)&&!standalone?"iPhone'da: Paylaş → Ana Ekrana Ekle, sonra uygulamayı ana ekrandan açıp tekrar deneyin.":"Bu tarayıcı bildirim desteklemiyor.");return}
  try{
    const perm=await Notification.requestPermission();
    if(perm!=="granted"){toast("Bildirim izni verilmedi. Ayarlar'dan açabilirsiniz.");return}
    const reg=await navigator.serviceWorker.ready;
    let sub=await reg.pushManager.getSubscription();
    if(!sub)sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64u(VAPID)});
    await rpc("trip_push_sub",{k:K,p:ME,s:sub.toJSON()});
    ls("nyc_push","1");renderSign();toast("🔔 Bildirimler açık: yeni öneri, mesaj, not ve rezervasyonlarda haber vereceğim.");
  }catch(e){toast("Bildirim açılamadı: "+(e.message||e))}
}
function openPushInfo(){openSheet(`<div class="dt"><div class="cat">Bildirimler</div><h3>🔔 Açık</h3><p>Şunlarda telefonuna bildirim gelir: Claude yeni öneri eklediğinde ya da sohbette cevap verdiğinde, ${PPL[OTHER()].n} mesaj ya da not yazdığında, bir rezervasyon ✓ işaretlendiğinde, ikiniz de aynı şeyi beğendiğinizde.</p></div><div class="acts2"><button class="btn" id="ptest">Test bildirimi</button><button class="btn" id="preset">Yeniden kaydet</button></div>`,"push");
  $("#ptest").onclick=async()=>{try{await rpc("trip_push_test",{k:K,p:ME});toast("Gönderildi, birkaç saniye içinde gelir")}catch(e){toast("Test gönderilemedi")}};
  $("#preset").onclick=()=>{ls("nyc_push",null);enablePush()};}

/* ---------- render ---------- */
function render(){
  if(!S)return;
  renderSign();renderTabs();
  const v=$("#view");
  $("#composer").classList.toggle("hide",tab!=="sohbet");
  if(tab==="hat")v.innerHTML=rHat();
  else if(tab==="rez")v.innerHTML=rRez();
  else if(tab==="kesfet")v.innerHTML=rKesfet();
  else if(tab==="harita"){v.innerHTML=rHarita();setTimeout(initMap,0)}
  else if(tab==="sohbet"){v.innerHTML=rSohbet();setTimeout(()=>scrollTo(0,document.body.scrollHeight),0)}
  bindView();
}
function renderSoft(){
  if(!S)return;
  const ae=document.activeElement;
  if(ae&&(ae.tagName==="TEXTAREA"||ae.tagName==="INPUT")&&ae.id!=="kq"){pendingRender=true;renderTabs();return}
  if(tab==="harita"&&LM){renderSign();renderTabs();drawMap(false)}
  else{const y=scrollY;render();if(tab!=="sohbet")scrollTo(0,y)}
  if(sheetFor&&sheetFor.startsWith("item:")){const it=I[sheetFor.slice(5)];if(it){const sc=$("#sbody").scrollTop;$("#sbody").innerHTML=itemSheet(it);bindSheet();$("#sbody").scrollTop=sc}}
  else if(sheetFor==="guide"){$("#sbody").innerHTML=guideSheet();bindSheet()}
}
let pendingRender=false;
document.addEventListener("focusout",()=>{if(pendingRender){pendingRender=false;setTimeout(renderSoft,150)}});
function bindView(){
  const v=$("#view");
  v.querySelectorAll("[data-day]").forEach(b=>b.onclick=()=>{selDay=b.dataset.day;ls("nyc_day",selDay);render()});
  v.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>openItem(b.dataset.open));
  v.querySelectorAll("[data-more]").forEach(b=>b.onclick=e=>{e.stopPropagation();openStop(b.dataset.more)});
  v.querySelectorAll("[data-v]").forEach(b=>b.onclick=e=>{e.stopPropagation();const [i,x]=b.dataset.v.split("|");doVote(i,+x)});
  v.querySelectorAll("[data-book]").forEach(b=>b.onclick=()=>doBook(b.dataset.book));
  v.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>{if(b.dataset.grp){openGrp=b.dataset.grp;kFilter="all"}go(b.dataset.go)});
  v.querySelectorAll("[data-kf]").forEach(b=>b.onclick=()=>{kFilter=b.dataset.kf;render()});
  v.querySelectorAll("details.grp").forEach(d=>d.ontoggle=()=>ls("nyc_g_"+d.dataset.g,d.open?"1":"0"));
  v.querySelectorAll("[data-md]").forEach(b=>b.onclick=()=>{mapDay=b.dataset.md;ls("nyc_mday",mapDay);v.querySelectorAll("[data-md]").forEach(x=>x.classList.toggle("on",x===b));drawMap(true)});
  v.querySelectorAll("[data-add]").forEach(b=>b.onclick=()=>openSheet(addSheet(b.dataset.add),"add"));
  v.querySelectorAll("[data-dnote]").forEach(b=>b.onclick=()=>openSheet(dayNoteSheet(b.dataset.dnote),"daynote"));
  v.querySelectorAll("[data-dmap]").forEach(b=>b.onclick=()=>{mapDay=b.dataset.dmap;ls("nyc_mday",mapDay);go("harita")});
  v.querySelectorAll("[data-delnote]").forEach(b=>b.onclick=()=>delNote(+b.dataset.delnote));
  v.querySelectorAll("[data-rm]").forEach(b=>b.onclick=()=>{rezMode=b.dataset.rm;ls("nyc_rezmode",rezMode);render()});
  v.querySelectorAll("[data-exp]").forEach(b=>b.onclick=()=>openExpense({item:b.dataset.exp}));
  v.querySelectorAll("[data-delexp]").forEach(b=>b.onclick=()=>{if(!confirm("Bu harcama silinsin mi?"))return;const id=+b.dataset.delexp;S.expenses=S.expenses.filter(e=>e.id!==id);send("trip_expense",{p:ME,title:"",amount:0,cur:"USD",paid_by:ME,split:"both",item_id:null,cat:null,del:id});renderSoft()});
  const ea=$("#eadd");if(ea)ea.onclick=()=>openExpense({});
  const bs=$("#bset");if(bs)bs.onclick=setBudget;
  const kq=$("#kq");if(kq){kq.oninput=()=>{kQuery=kq.value;clearTimeout(kq._t);kq._t=setTimeout(()=>{const p=kq.selectionStart;render();const n=$("#kq");n.focus();n.setSelectionRange(p,p)},250)}}
}
$("#csend").onclick=()=>{const t=$("#cin");doChat(t.value);t.value="";t.style.height="42px"};
$("#cin").addEventListener("input",e=>{const t=e.target;t.style.height="42px";t.style.height=Math.min(120,t.scrollHeight)+"px"});

/* ---------- gate ---------- */
function gate(){
  const g=$("#gate");g.classList.add("on");
  const snow=`<div class="snow">${Array.from({length:30},(_,i)=>`<i style="position:absolute;left:${(i*37)%100}%;top:${(i*53)%100}%;width:${2+i%3}px;height:${2+i%3}px;border-radius:50%;background:#fff;opacity:${.3+(i%5)/10}"></i>`).join("")}</div>`;
  if(!K){g.innerHTML=snow+`<span class="bul" style="width:56px;height:56px;background:var(--red);color:#fff;font-size:20px">NY</span><h1>Noel'den<br>Yılbaşına</h1><p>Erişim kodunu girin (linkte vardı).</p><input id="gk" placeholder="nyc-…" autocapitalize="off" autocomplete="off"><button class="btn r" id="gok" style="height:50px;width:100%;justify-content:center;font-size:17px">Devam</button>`;
    $("#gok").onclick=()=>{const v=$("#gk").value.trim();if(!v)return;K=v;ls("nyc_k",v);g.classList.remove("on");boot()};return}
  pickPerson();
}
function pickPerson(){
  const g=$("#gate");g.classList.add("on");
  g.innerHTML=`<span class="bul" style="width:56px;height:56px;background:var(--red);color:#fff;font-size:20px">NY</span><h1>Kimsin?</h1><p>Oylar, notlar ve bildirimler kişiye göre ayrılıyor.</p><div class="who">${Object.entries(PPL).map(([k,p])=>`<button data-p="${k}"><span class="bul" style="background:${p.c}">${p.l}</span>${p.n}</button>`).join("")}</div>`;
  g.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>{ME=b.dataset.p;ls("nyc_me",ME);g.classList.remove("on");render();if(ls("nyc_push")==="1")enablePush()})
}

/* ---------- boot ---------- */
function boot(){
  if(!K)return gate();
  try{const c=ls("nyc_state");if(c){norm(JSON.parse(c));}}catch(e){}
  if(!ME)pickPerson();
  if(S)render();else $("#view").innerHTML=`<div class="empty">Yükleniyor…</div>`;
  lastSnap=null;load();
  setInterval(()=>{if(!document.hidden)load()},15000);
  document.addEventListener("visibilitychange",()=>{if(!document.hidden){load();renderSign()}});
  markSeen();
}
if("serviceWorker" in navigator){
  navigator.serviceWorker.register("sw.js").catch(()=>{});
  navigator.serviceWorker.addEventListener("message",e=>{if(e.data&&e.data.type==="open"&&e.data.tab)go(e.data.tab)});
}
window.addEventListener("hashchange",()=>{const t=location.hash.slice(1);if(t&&t!==tab&&["hat","rez","kesfet","harita","sohbet"].includes(t)){tab=t;render()}});
boot();
</script>
