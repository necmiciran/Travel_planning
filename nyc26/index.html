<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07080d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="NYC '26">
<title>NYC Kış '26 · Necmi & Ahmet</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{
  --bg:#07080d;--bg2:#0d1020;--glass:rgba(255,255,255,.065);--glass2:rgba(255,255,255,.1);--glassS:rgba(22,24,38,.72);
  --line:rgba(255,255,255,.09);--line2:rgba(255,255,255,.16);
  --t1:#f5f5f7;--t2:rgba(235,235,245,.68);--t3:rgba(235,235,245,.42);
  --gold:#f7c75b;--gold2:#ff9f43;--red:#ff453a;--green:#30d158;--blue:#0a84ff;--purple:#bf5af2;--pink:#ff375f;--teal:#64d2ff;--yellow:#ffd60a;--orange:#ff9f0a;
  --grad:linear-gradient(135deg,#ff9f43 0%,#ff375f 45%,#bf5af2 100%);
  --gradGold:linear-gradient(135deg,#ffe29a 0%,#f7c75b 40%,#ff9f43 100%);
  --r:18px;--r2:12px;
  --safeT:env(safe-area-inset-top,0px);--safeB:env(safe-area-inset-bottom,0px);
  --f:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue",system-ui,sans-serif;
  --m:ui-monospace,"SF Mono",SFMono-Regular,Menlo,monospace;
  --spring:cubic-bezier(.32,.72,0,1);
  --ink:var(--t1);--mute:var(--t2);--paper2:var(--glass);--card:var(--glass);--line2c:var(--line2);--blueC:var(--blue);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
html,body{margin:0;color:var(--t1);font-family:var(--f);font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased}
body{min-height:100vh;padding-bottom:calc(92px + var(--safeB));overscroll-behavior-y:none;
  background:
   radial-gradient(1100px 620px at 85% -10%,rgba(191,90,242,.22),transparent 60%),
   radial-gradient(900px 600px at -10% 10%,rgba(10,132,255,.20),transparent 60%),
   radial-gradient(900px 700px at 50% 110%,rgba(255,159,67,.13),transparent 60%),
   linear-gradient(180deg,#0b0e1c 0%,#07080d 70%);
  background-attachment:fixed}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
a{color:inherit}
input,textarea,select{font:inherit;color:var(--t1)}
.mono{font-family:var(--m);font-variant-numeric:tabular-nums}
.hide{display:none!important}
.i{width:1.15em;height:1.15em;flex:none;display:inline-block;vertical-align:-.2em;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.i.f{fill:currentColor;stroke:none}
button:active,.press:active{transform:scale(.97);transition:transform 90ms ease-out}

/* ---------- header (large title, glass) ---------- */
.sign{position:sticky;top:0;z-index:1040;padding:calc(10px + var(--safeT)) 16px 10px;background:linear-gradient(180deg,rgba(7,8,13,.86),rgba(7,8,13,.62));-webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);border-bottom:.5px solid var(--line)}
.signrow{display:flex;align-items:center;gap:12px}
.signrow .tt{flex:1;min-width:0}
.sign h1{margin:0;font-size:24px;font-weight:800;letter-spacing:-.025em;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:var(--gradGold);-webkit-background-clip:text;background-clip:text;color:transparent}
.sign .sub{font-size:11.5px;font-weight:600;color:var(--t3);letter-spacing:.06em;text-transform:uppercase;margin-top:3px}
.bul{display:inline-grid;place-items:center;border-radius:50%;font-weight:800;flex:none;line-height:1;letter-spacing:-.02em;box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 2px 8px rgba(0,0,0,.3)}
.bul .i{width:58%;height:58%;stroke-width:2.1}
.sign .logo{width:42px;height:42px;font-size:15px;background:var(--grad);color:#fff;box-shadow:0 6px 18px rgba(255,55,95,.35),inset 0 1px 0 rgba(255,255,255,.35)}
.cd{text-align:right;flex:none}
.cd b{display:block;font-family:var(--m);font-size:24px;line-height:1;font-weight:700;letter-spacing:-.03em}
.cd span{font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--t3);font-weight:600}
.clk{margin-top:6px;font-family:var(--m);font-size:12px;font-weight:600;display:flex;gap:12px;flex-wrap:wrap;color:var(--t2)}
.clk span{display:inline-flex;gap:5px;align-items:center;white-space:nowrap}
.clk i{font-style:normal;font-family:var(--f);font-size:9px;letter-spacing:.12em;color:var(--t3);font-weight:700}
.sbtns{display:flex;gap:6px;margin-top:10px;align-items:center;overflow-x:auto;scrollbar-width:none}
.sbtns::-webkit-scrollbar{display:none}
.pill{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 11px;border-radius:15px;background:var(--glass);border:.5px solid var(--line2);font-size:12.5px;font-weight:600;white-space:nowrap;flex:none}
.pill .dot{width:18px;height:18px;font-size:10px;color:#fff}
.pill.me{background:rgba(255,255,255,.92);color:#111;border-color:transparent}
.pill.warn{background:rgba(247,199,91,.14);border-color:rgba(247,199,91,.45);color:var(--gold)}
.sbtns .sp{flex:1;min-width:4px}
#net{position:sticky;top:0;z-index:1039;background:rgba(255,214,10,.95);color:#111;font-size:12.5px;font-weight:700;text-align:center;padding:6px 10px}

/* ---------- floating glass tab bar ---------- */
nav.tabs{position:fixed;left:10px;right:10px;bottom:calc(8px + var(--safeB));z-index:1050;display:grid;grid-template-columns:repeat(5,1fr);padding:7px 6px;border-radius:26px;background:rgba(22,24,38,.66);-webkit-backdrop-filter:blur(28px) saturate(190%);backdrop-filter:blur(28px) saturate(190%);border:.5px solid rgba(255,255,255,.14);box-shadow:0 12px 40px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.08)}
nav.tabs button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:600;color:var(--t3);position:relative;padding:4px 0;border-radius:18px;transition:color .2s}
nav.tabs button .ti{width:30px;height:30px;border-radius:12px;display:grid;place-items:center;transition:background .25s var(--spring),transform .25s var(--spring)}
nav.tabs button .ti .i{width:21px;height:21px}
nav.tabs button.on{color:var(--t1)}
nav.tabs button.on .ti{background:var(--grad);color:#fff;box-shadow:0 4px 14px rgba(255,55,95,.35);transform:translateY(-1px)}
nav.tabs .badge{position:absolute;top:0;left:calc(50% + 7px);min-width:17px;height:17px;border-radius:9px;background:var(--red);color:#fff;font-size:10px;display:grid;place-items:center;padding:0 4px;font-family:var(--m);font-weight:700;box-shadow:0 0 0 2px rgba(22,24,38,.9)}

main{padding:0 0 20px}
main.enter>*{animation:rise .42s var(--spring) both}
main.enter>*:nth-child(2){animation-delay:.03s}main.enter>*:nth-child(3){animation-delay:.06s}main.enter>*:nth-child(4){animation-delay:.09s}main.enter>*:nth-child(5){animation-delay:.12s}main.enter>*:nth-child(n+6){animation-delay:.15s}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.wrap{padding:0 16px}
h2.sec{margin:26px 16px 10px;font-size:20px;font-weight:750;letter-spacing:-.02em;display:flex;align-items:baseline;gap:8px}
h2.sec small{font-family:var(--m);font-size:12px;color:var(--t3);font-weight:600;letter-spacing:0}

/* ---------- day strip ---------- */
.strip{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:14px 16px 4px;scroll-snap-type:x proximity}
.strip::-webkit-scrollbar{display:none}
.strip .rail{display:none}
.st{position:relative;flex:0 0 58px;height:74px;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:var(--glass);border:.5px solid var(--line);scroll-snap-align:center;transition:transform .3s var(--spring),background .3s}
.st i{display:none}
.st b{font-size:22px;font-weight:750;letter-spacing:-.03em;line-height:1}
.st span{font-size:10px;font-weight:700;letter-spacing:.06em;color:var(--t3)}
.st em{position:absolute;top:6px;font-style:normal;font-size:8px;font-weight:800;letter-spacing:.06em;color:var(--gold);text-transform:uppercase}
.st.on{background:linear-gradient(160deg,var(--day),color-mix(in srgb,var(--day) 55%,#000));border-color:transparent;box-shadow:0 8px 22px color-mix(in srgb,var(--day) 45%,transparent);transform:translateY(-2px)}
.st.on span,.st.on em{color:rgba(255,255,255,.85)}
.st.today:after{content:"";position:absolute;bottom:7px;width:5px;height:5px;border-radius:50%;background:var(--gold)}

/* ---------- day header ---------- */
.dayh{display:flex;align-items:center;gap:14px;padding:18px 16px 4px}
.dayh .big{width:56px;height:56px;font-size:24px;background:linear-gradient(160deg,var(--day),color-mix(in srgb,var(--day) 50%,#000));color:#fff}
.dayh h3{margin:0;font-size:28px;font-weight:800;letter-spacing:-.03em;line-height:1.05}
.dayh p{margin:4px 0 0;color:var(--t2);font-size:13px}
.wxl{margin:10px 16px 0;padding:10px 12px;border-radius:14px;background:linear-gradient(135deg,rgba(10,132,255,.18),rgba(100,210,255,.08));border:.5px solid rgba(100,210,255,.25);font-size:13px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.wxl .i{width:22px;height:22px;color:var(--teal)}
.dact{display:flex;gap:8px;padding:12px 16px 2px;overflow-x:auto;scrollbar-width:none}
.dact::-webkit-scrollbar{display:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:38px;padding:0 14px;border-radius:12px;font-weight:650;font-size:13.5px;background:var(--glass2);border:.5px solid var(--line2);text-decoration:none;white-space:nowrap;flex:none;transition:transform .12s,background .2s}
.btn .i{width:17px;height:17px}
.btn.k{background:var(--grad);border-color:transparent;color:#fff;box-shadow:0 6px 18px rgba(255,55,95,.28)}
.btn.r{background:rgba(255,69,58,.16);border-color:rgba(255,69,58,.4);color:#ff6b62}
.btn.g{background:rgba(48,209,88,.18);border-color:rgba(48,209,88,.45);color:#5fe07f}
.btn.s{height:32px;padding:0 11px;font-size:12.5px;border-radius:10px}
.btn[disabled]{opacity:.45}

/* ---------- timeline ---------- */
.line{position:relative;margin:14px 16px 0}
.line:before{content:"";position:absolute;left:61px;top:14px;bottom:14px;width:4px;border-radius:2px;background:linear-gradient(180deg,var(--day),color-mix(in srgb,var(--day) 40%,transparent));box-shadow:0 0 14px color-mix(in srgb,var(--day) 60%,transparent)}
.stop,.leg,.gap{position:relative;display:grid;grid-template-columns:48px 26px 1fr;align-items:start}
.stop .tm{font-family:var(--m);font-size:13px;font-weight:700;padding-top:14px;text-align:right;padding-right:8px;color:var(--t2)}
.stop .nd{position:relative;z-index:1;width:16px;height:16px;margin:15px 0 0 6px;border-radius:50%;background:var(--bg);border:3px solid var(--day)}
.stop.exp .nd{background:var(--day)}
.stop.ok .nd{background:var(--green);border-color:var(--green);box-shadow:0 0 0 4px rgba(48,209,88,.2)}
.bw{position:relative}
.more{position:absolute;right:8px;top:9px;z-index:2;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.08);color:var(--t2)}
.stop .bx{margin:4px 0 6px 6px;width:calc(100% - 6px);text-align:left;display:flex;gap:11px;align-items:flex-start;padding:10px 44px 11px 10px;border-radius:var(--r);background:var(--glass);border:.5px solid var(--line);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);box-shadow:0 8px 24px rgba(0,0,0,.22)}
.stop .bx .ph{width:54px;height:54px;flex:none;border-radius:12px;background:#222 center/cover}
.bx .tx{flex:1;min-width:0}
.bx .tx b{display:block;font-size:15.5px;font-weight:650;letter-spacing:-.01em;line-height:1.2}
.bx .tx small{display:block;color:var(--t2);font-size:12px;margin-top:2px}
.ord{display:flex;gap:5px;align-items:flex-start;margin-top:5px;font-size:12.5px;font-weight:600;color:#ffb38a}
.ord .i{margin-top:1px}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:700;letter-spacing:.02em;padding:3px 7px;border-radius:7px;background:rgba(255,255,255,.08);color:var(--t2);white-space:nowrap}
.tag .i{width:12px;height:12px}
.tag.ok{background:rgba(48,209,88,.18);color:#5fe07f}.tag.need{background:rgba(255,159,10,.18);color:#ffb340}.tag.both{background:rgba(166,228,255,.2);color:#c4efff}
.tag.urg{background:rgba(255,69,58,.2);color:#ff7b73}.tag.ar{background:rgba(255,255,255,.06);color:var(--t3)}.tag.by{background:rgba(10,132,255,.18);color:#66b3ff}.tag.taste{background:rgba(247,199,91,.16);color:var(--gold)}
.leg{min-height:24px;color:var(--t3);font-size:12px}
.leg .lx{grid-column:3;margin-left:12px;padding:2px 0 4px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.leg .lx>span,.leg a{display:inline-flex;align-items:center;gap:4px}
.leg a{text-decoration:none;color:var(--t2);font-weight:600}
.leg .i{width:14px;height:14px}
.gap .gx{grid-column:3;margin:2px 0 8px 6px;border-radius:var(--r);padding:11px 12px;font-size:13px;background:linear-gradient(135deg,rgba(247,199,91,.10),rgba(255,159,67,.04));border:.5px dashed rgba(247,199,91,.35)}
.gap .gx b{font-weight:700}
.gap .gx .hd{display:flex;align-items:center;gap:7px}
.gap .gx .hd .i{color:var(--gold)}
.gap .gx .sg{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.sgb{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;border-radius:16px;padding:5px 10px 5px 5px;background:var(--glass2);border:.5px solid var(--line2)}
.sgb .bul{width:20px;height:20px;font-size:9px}
.endst{display:grid;grid-template-columns:48px 26px 1fr;align-items:center;margin-top:2px}
.endst .nd{width:14px;height:14px;margin-left:7px;border-radius:4px;background:var(--day);position:relative;z-index:1}
.endst span{margin-left:10px;font-size:12px;color:var(--t3);font-weight:600}
.empty{margin:18px 16px;padding:20px;border-radius:var(--r);border:.5px dashed var(--line2);color:var(--t2);text-align:center;font-size:14px;background:var(--glass)}

/* ---------- alerts ---------- */
.alert{margin:12px 16px 0;width:calc(100% - 32px);text-align:left;display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:var(--r);background:linear-gradient(135deg,rgba(255,69,58,.24),rgba(255,55,95,.12));border:.5px solid rgba(255,69,58,.4);color:var(--t1)}
.alert .ai{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:rgba(255,69,58,.3);flex:none}
.alert .ai .i{width:19px;height:19px}
.alert b{display:block;font-size:14px;font-weight:700}
.alert span{font-size:12.5px;color:var(--t2)}
.alert.y{background:linear-gradient(135deg,rgba(247,199,91,.2),rgba(255,159,67,.08));border-color:rgba(247,199,91,.4)}
.alert.y .ai{background:rgba(247,199,91,.28);color:var(--gold)}

/* ---------- lists ---------- */
.list{margin:0 16px;border-radius:var(--r);background:var(--glass);border:.5px solid var(--line);overflow:hidden}
.row{display:flex;gap:12px;align-items:center;padding:11px 12px;border-bottom:.5px solid var(--line);text-align:left;width:100%}
.row:last-child{border-bottom:0}
.row .bul{width:32px;height:32px;font-size:13px}
.row .ph{width:58px;height:58px;flex:none;border-radius:13px;background:#222 center/cover;position:relative}
.row .ph .bul{position:absolute;right:-5px;bottom:-5px;width:22px;height:22px;font-size:10px;box-shadow:0 0 0 2px #15182a}
.row .tx{flex:1;min-width:0}
.row .tx b{display:block;font-size:15px;font-weight:650;letter-spacing:-.01em;line-height:1.2}
.row .tx small{display:block;color:var(--t2);font-size:12px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .pr{font-family:var(--m);font-size:11.5px;font-weight:600;color:var(--t2);margin-top:3px}
.row .rt{display:flex;align-items:center;gap:3px;font-size:11.5px;font-weight:700;color:var(--gold);margin-top:3px}
.row .rt .i{width:12px;height:12px}
.vq{display:flex;gap:6px;flex:none}
.vq button{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;background:rgba(255,255,255,.07);border:.5px solid var(--line);color:var(--t2);transition:transform .15s var(--spring),background .2s}
.vq button .i{width:18px;height:18px}
.vq button.on.up{background:linear-gradient(135deg,#c4efff,#8ad9ff);color:#0b3a52;border-color:transparent;box-shadow:0 4px 12px rgba(166,228,255,.45)}
.vq button.on.dn{background:linear-gradient(135deg,#ff453a,#d70015);color:#fff;border-color:transparent;box-shadow:0 4px 12px rgba(255,69,58,.35)}
.row.nope>button:first-child{opacity:.45}
.who{display:flex;gap:3px;justify-content:flex-end;margin-top:5px}
.who i{font-style:normal;font-size:9.5px;font-weight:800;width:16px;height:16px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.08);color:var(--t3)}
.who i.l{background:#a6e4ff;color:#0b3a52}.who i.d{background:#ff453a;color:#fff;text-decoration:line-through}
.chips{display:flex;gap:7px;overflow-x:auto;padding:14px 16px 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:5px;height:32px;padding:0 13px;border-radius:16px;font-size:13px;font-weight:600;background:var(--glass);border:.5px solid var(--line2);white-space:nowrap;transition:background .2s,color .2s}
.chip .i{width:15px;height:15px}
.chip.on{background:rgba(255,255,255,.94);color:#111;border-color:transparent}
.search{margin:14px 16px 0;display:flex;align-items:center;gap:8px;border-radius:13px;background:rgba(118,118,128,.24);padding:0 11px;height:40px;color:var(--t3)}
.search input{flex:1;border:0;background:none;outline:none;font-size:16px;color:var(--t1)}
.search input::placeholder{color:var(--t3)}
details.grp{margin:0 0 6px}
.cmp{margin:0 16px 12px;border-radius:var(--r);background:var(--glass);border:.5px solid var(--line);overflow:hidden}
.cmph{padding:11px 12px 9px;border-bottom:.5px solid var(--line)}.cmph b{display:block;font-size:15px}.cmph small{font-size:11.5px;color:var(--t3)}
.cr{display:flex;gap:10px;align-items:center;padding:9px 6px 9px 12px;border-bottom:.5px solid var(--line);cursor:pointer}.cr:last-child{border-bottom:0}
.cr.ref{background:rgba(10,132,255,.16)}.cr.nope{opacity:.45}
.cr .cl{flex:1;min-width:0}.cr .cl b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.cr small{display:block;font-size:11.5px;color:var(--t2)}.cr .cn{color:var(--t3)}
.cr .src{font-size:10px;font-weight:700;padding:1px 5px;border-radius:5px;background:rgba(255,255,255,.08);margin-right:5px}.cr .src.dir{background:rgba(247,199,91,.2);color:var(--gold)}
.cr .cv{text-align:right;flex:none}.cr .cv b{font-family:var(--m);font-size:13.5px}.cr .d{font-family:var(--m);font-size:11px;font-weight:700;color:var(--t3)}.cr .d.up{color:#ff8a80}.cr .d.dn{color:var(--green)}
.cr .co{width:26px;height:30px;color:var(--t3);font-size:20px;flex:none}
details.grp>summary{list-style:none;display:flex;align-items:center;gap:12px;padding:16px 16px 10px;cursor:pointer}
details.grp>summary::-webkit-details-marker{display:none}
details.grp>summary .bul{width:34px;height:34px;font-size:14px}
details.grp>summary b{flex:1;font-size:19px;font-weight:750;letter-spacing:-.02em}
details.grp>summary small{font-family:var(--m);font-size:12px;color:var(--t3);font-weight:600}
details.grp>summary:after{content:"";width:9px;height:9px;border-right:2px solid var(--t3);border-bottom:2px solid var(--t3);transform:rotate(-45deg);transition:transform .3s var(--spring);margin-right:4px}
details.grp[open]>summary:after{transform:rotate(45deg)}
details.grp[open]>.list{animation:rise .35s var(--spring) both}

/* ---------- progress / budget ---------- */
.prog{margin:14px 16px 6px;border-radius:22px;padding:16px;background:linear-gradient(145deg,rgba(255,255,255,.09),rgba(255,255,255,.03));border:.5px solid var(--line2);box-shadow:0 12px 30px rgba(0,0,0,.25)}

.prog b{font-size:16px;font-weight:750}
.prog small{color:var(--t2);font-size:12.5px}
.big{font-size:34px!important;font-weight:800!important;letter-spacing:-.04em;background:var(--gradGold);-webkit-background-clip:text;background-clip:text;color:transparent}
.rv{border-bottom:.5px solid var(--line);padding:12px}
.rv:last-child{border-bottom:0}
.rv .top{display:flex;gap:12px;align-items:center;text-align:left;width:100%}
.rv .bk{font-size:12.5px;color:var(--t2);margin:8px 0 0 44px;padding:8px 10px;border-radius:10px;background:rgba(255,159,10,.1);border-left:3px solid var(--orange)}
.rv .acts{display:flex;gap:6px;margin:9px 0 0 44px;flex-wrap:wrap}

/* ---------- map ---------- */
#mapwrap{position:relative;margin:10px 16px 0;border-radius:22px;overflow:hidden;border:.5px solid var(--line2);box-shadow:0 14px 34px rgba(0,0,0,.4)}
#lmap{height:calc(100vh - 290px - var(--safeT) - var(--safeB));min-height:360px;background:#11131c}
.leaflet-container{font-family:var(--f);background:#11131c}
.leaflet-tile-pane{filter:invert(1) hue-rotate(185deg) brightness(.92) contrast(.88) saturate(.6)}
.leaflet-control-attribution{background:rgba(0,0,0,.5)!important;color:#999!important}.leaflet-control-attribution a{color:#bbb!important}
.mk{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:12px;border:2.5px solid #fff;box-shadow:0 4px 12px rgba(0,0,0,.5)}
.mk .i{width:16px;height:16px;stroke-width:2.2}
.mk.n{border-radius:10px}
.mk.me{background:var(--blue);width:18px;height:18px;box-shadow:0 0 0 6px rgba(10,132,255,.3)}
.mkh{display:inline-flex;align-items:center;gap:5px;white-space:nowrap;background:#fff;color:#111;font-size:11.5px;font-weight:700;padding:4px 8px;border-radius:12px;border:2px solid #111;box-shadow:0 4px 12px rgba(0,0,0,.45);transform:translate(-4px,-4px)}
.mkh b{font-family:var(--m);font-size:11px;background:#111;color:#fff;border-radius:7px;padding:1px 5px}
.mkh.l1{border-color:#66b3ff}.mkh.lk{border-color:#0a84ff;box-shadow:0 0 0 3px rgba(10,132,255,.45),0 4px 12px rgba(0,0,0,.45)}.mkh.no{opacity:.5}
.mk.ht{background:#fff;color:#111;border-color:#111;border-radius:10px}
.leaflet-popup-content-wrapper{border-radius:16px;background:rgba(28,30,44,.92);color:var(--t1);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);box-shadow:0 12px 30px rgba(0,0,0,.5)}
.leaflet-popup-tip{background:rgba(28,30,44,.92)}
.leaflet-popup-content{margin:12px 14px;font-size:13px}
.leaflet-container a.leaflet-popup-close-button{color:#aaa}
.pp b{display:block;font-size:15px;font-weight:700}
.pp small{color:var(--t2)}
.pp div{color:var(--t2);margin-top:3px;display:flex;align-items:center;gap:4px}
.pp .dl{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.pp .dl a,.pp .dl button{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:650;border-radius:9px;padding:6px 9px;text-decoration:none;background:rgba(255,255,255,.12);color:#fff}
.mtools{position:absolute;right:10px;top:10px;z-index:900;display:flex;flex-direction:column;gap:8px}
.mtools button{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:rgba(28,30,44,.82);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border:.5px solid var(--line2);color:var(--t1)}
.legend{display:flex;gap:12px;flex-wrap:wrap;padding:10px 16px;font-size:11.5px;color:var(--t2)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend .bul{width:16px;height:16px;font-size:8px}

/* ---------- chat ---------- */
.chat{padding:8px 16px 140px;display:flex;flex-direction:column}
.msg{max-width:84%;margin:5px 0;padding:10px 13px;border-radius:20px;font-size:15px;white-space:pre-wrap;word-wrap:break-word;animation:rise .3s var(--spring) both}
.msg .mh{display:flex;align-items:center;gap:5px;font-size:10.5px;font-weight:700;letter-spacing:.04em;margin-bottom:3px;opacity:.75}
.msg .mh .i{width:12px;height:12px}
.msg.me{align-self:flex-end;background:linear-gradient(135deg,#0a84ff,#5e5ce6);color:#fff;border-bottom-right-radius:6px}
.msg.ot{align-self:flex-start;background:rgba(255,255,255,.1);border-bottom-left-radius:6px}
.msg.cl{align-self:flex-start;max-width:94%;background:linear-gradient(135deg,rgba(247,199,91,.16),rgba(255,159,67,.08));border:.5px solid rgba(247,199,91,.3);border-bottom-left-radius:6px}
.msg .pend{font-size:11px;opacity:.7;margin-top:3px}
.composer{position:fixed;left:10px;right:10px;bottom:calc(84px + var(--safeB));z-index:1045;display:flex;gap:8px;padding:8px;border-radius:24px;background:rgba(22,24,38,.72);-webkit-backdrop-filter:blur(26px);backdrop-filter:blur(26px);border:.5px solid var(--line2)}

.hint{font-size:12.5px;color:var(--t3);padding:10px 16px 0;line-height:1.45}

/* ---------- sheet ---------- */
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:1090;opacity:0;pointer-events:none;transition:opacity .35s var(--spring);-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px)}

.hero{display:flex;gap:14px;align-items:center}

.dt{padding:12px 18px 0}
.dt .cat{font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--t3)}
.dt h3{margin:3px 0 0;font-size:26px;font-weight:800;letter-spacing:-.03em;line-height:1.08}
.dt .sb{color:var(--t2);font-size:14px;margin-top:6px}
.dt p{font-size:15px;line-height:1.5;margin:12px 0 0;color:rgba(245,245,247,.88)}
.fun{display:flex;gap:9px;align-items:flex-start;margin:12px 0 0;padding:12px 13px;border-radius:14px;background:linear-gradient(135deg,rgba(247,199,91,.14),rgba(255,159,67,.05));border:.5px solid rgba(247,199,91,.3);font-size:14px;line-height:1.45}

.fun.season{background:linear-gradient(135deg,rgba(10,132,255,.16),rgba(100,210,255,.05));border-color:rgba(100,210,255,.3)}.fun.season>.i{color:var(--teal)}
.fun.warn{background:linear-gradient(135deg,rgba(255,214,10,.16),rgba(255,159,10,.06));border-color:rgba(255,214,10,.4)}.fun.warn>.i{color:var(--yellow)}
.facts{display:grid;grid-template-columns:1fr 1fr;margin:16px 16px 0;border-radius:var(--r);background:var(--glass);border:.5px solid var(--line);overflow:hidden}
.facts div{padding:10px 12px;border-bottom:.5px solid var(--line);font-size:13.5px}
.facts div.wide{grid-column:1/-1}
.facts small{display:block;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--t3);margin-bottom:2px}
.vbig{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 16px 0}
.vbig button{height:50px;border-radius:15px;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:700;font-size:15px;background:var(--glass2);border:.5px solid var(--line2)}
.vbig button .i{width:20px;height:20px}
.vbig button.on.up{background:linear-gradient(135deg,#c4efff,#8ad9ff);border-color:transparent;color:#0b3a52;box-shadow:0 8px 20px rgba(166,228,255,.45)}
svg.i.ic-heart{color:#a6e4ff}
.vbig button.on.dn{background:linear-gradient(135deg,#ff453a,#d70015);border-color:transparent;color:#fff;box-shadow:0 8px 20px rgba(255,69,58,.35)}
.ov{margin:8px 18px 0;font-size:12.5px;color:var(--t2)}
.acts2{display:flex;flex-wrap:wrap;gap:8px;margin:14px 16px 0}
.plbox{margin:16px 16px 0;padding:12px;border-radius:var(--r);background:var(--glass);border:.5px solid var(--line);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.plbox label{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--t3);width:100%}
.plbox select,.plbox input{height:40px;border:.5px solid var(--line2);border-radius:11px;background:rgba(118,118,128,.24);padding:0 10px;font-size:16px;color:var(--t1);color-scheme:dark}
.plbox summary{color:var(--t1)}
.notes{margin:18px 16px 0}
.notes h4{margin:0 0 6px;font-size:13px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--t3)}
.note{display:flex;gap:10px;padding:10px 0;border-bottom:.5px solid var(--line)}
.note .av{width:26px;height:26px;font-size:11px;color:#fff}
.note .nt{flex:1;font-size:14.5px;white-space:pre-wrap}
.note .nt small{display:block;color:var(--t3);font-size:11px;margin-top:2px}
.note .del,.del{font-size:12px;color:var(--t3)}
.nform{display:flex;gap:8px;margin-top:10px}
.nform textarea{flex:1;height:42px;resize:none;border:0;border-radius:14px;padding:10px 12px;background:rgba(118,118,128,.24);font-size:16px;outline:none}
.gd{margin:6px 16px 0}
.gd details{border-radius:var(--r);background:var(--glass);border:.5px solid var(--line);margin-bottom:8px;overflow:hidden}
.gd summary{list-style:none;display:flex;gap:12px;align-items:center;padding:14px;font-weight:700;font-size:16px;letter-spacing:-.01em}
.gd summary::-webkit-details-marker{display:none}
.gd summary .ic{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:var(--grad);color:#fff;flex:none}
.gd summary .ic .i{width:17px;height:17px}
.gd ul{margin:0 14px 14px;padding-left:18px;color:rgba(245,245,247,.88)}
.gd li{margin:7px 0;font-size:14px;line-height:1.45}
.pick .row{padding:9px 12px}

#toast{position:fixed;left:16px;right:16px;top:calc(12px + var(--safeT));z-index:1200;display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:18px;background:rgba(36,38,54,.9);-webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);border:.5px solid var(--line2);box-shadow:0 14px 40px rgba(0,0,0,.45);font-size:14px;font-weight:600;transform:translateY(-140%);opacity:0;visibility:hidden;transition:transform .5s var(--spring),opacity .3s,visibility .5s}
#toast.on{transform:none;opacity:1;visibility:visible}
#toast .ti{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;background:var(--grad);color:#fff;flex:none}
#toast .ti .i{width:17px;height:17px}

/* ---------- gate / splash / celebrate ---------- */
#gate{position:fixed;inset:0;z-index:1300;display:none;flex-direction:column;justify-content:flex-end;padding:30px 24px calc(34px + var(--safeB));overflow:hidden;
  background:radial-gradient(800px 500px at 80% 0%,rgba(191,90,242,.45),transparent 60%),radial-gradient(700px 500px at 0% 30%,rgba(10,132,255,.4),transparent 60%),radial-gradient(800px 600px at 50% 100%,rgba(255,159,67,.3),transparent 60%),#07080d}
#gate.on{display:flex}
#gate h1{font-size:52px;font-weight:850;letter-spacing:-.045em;line-height:.95;margin:18px 0 10px;background:var(--gradGold);-webkit-background-clip:text;background-clip:text;color:transparent}
#gate p{color:var(--t2);margin:0 0 24px;font-size:16px}
#gate .who{display:grid;gap:12px;margin:0}
#gate .who button{height:64px;border-radius:20px;font-size:20px;font-weight:700;display:flex;align-items:center;gap:14px;padding:0 16px;text-align:left;background:rgba(255,255,255,.1);border:.5px solid rgba(255,255,255,.2);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px)}
#gate .who .bul{width:38px;height:38px;font-size:16px;color:#fff}
#gate input{width:100%;height:54px;border-radius:16px;border:.5px solid rgba(255,255,255,.25);background:rgba(255,255,255,.08);padding:0 14px;font-size:17px;margin-bottom:12px;font-family:var(--m)}
.sky{position:absolute;left:0;right:0;bottom:0;height:46%;opacity:.55;pointer-events:none}
.snow{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.snow i{position:absolute;top:-10px;border-radius:50%;background:#fff;animation:fall linear infinite}
@keyframes fall{to{transform:translate3d(30px,110vh,0)}}
#splash{position:fixed;inset:0;z-index:1400;display:grid;place-items:center;background:radial-gradient(700px 500px at 70% 10%,rgba(191,90,242,.5),transparent 60%),radial-gradient(700px 500px at 10% 60%,rgba(10,132,255,.45),transparent 60%),radial-gradient(600px 500px at 60% 100%,rgba(255,159,67,.35),transparent 60%),#07080d;transition:opacity .6s ease,transform .7s var(--spring),filter .6s}
#splash.out{opacity:0;transform:scale(1.08);filter:blur(10px);pointer-events:none}
#splash .lg{text-align:center;animation:pop .9s var(--spring) both}

@keyframes pop{from{opacity:0;transform:scale(.8) translateY(20px)}to{opacity:1;transform:none}}
#party{position:fixed;inset:0;z-index:1500;display:none;place-items:center;background:radial-gradient(circle at 50% 45%,rgba(255,55,95,.35),rgba(7,8,13,.82) 65%);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
#party.on{display:grid;animation:fadein .3s ease both}
#party canvas{position:absolute;inset:0;width:100%;height:100%}
#party .pc{position:relative;text-align:center;padding:30px;animation:pop .7s var(--spring) both}
#party .pc .bg{width:110px;height:110px;margin:0 auto;border-radius:34px;display:grid;place-items:center;background:var(--grad);box-shadow:0 20px 60px rgba(255,55,95,.55);color:#fff}
#party .pc .bg .i{width:58px;height:58px;stroke-width:1.7}
#party .pc h2{margin:22px 0 6px;font-size:34px;font-weight:850;letter-spacing:-.04em;line-height:1.05;background:var(--gradGold);-webkit-background-clip:text;background-clip:text;color:transparent}
#party .pc p{margin:0 auto;max-width:300px;color:var(--t1);font-size:16px;opacity:.9}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@media (min-width:700px){body{max-width:560px;margin:0 auto}nav.tabs,.composer,#sheet{max-width:560px;margin:0 auto}nav.tabs,.composer{left:0;right:0;margin:0 auto;width:calc(100% - 20px)}}
@media (prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.12s!important}.snow{display:none}}
@media (prefers-reduced-transparency:reduce){nav.tabs,#sheet,.sign,.composer,#toast{background:#1b1d2a;-webkit-backdrop-filter:none;backdrop-filter:none}}
.i .sf{fill:currentColor;stroke:none}
#ppush .fbadge{min-width:18px;height:18px;border-radius:9px;background:var(--red);color:#fff;font-size:10.5px;font-weight:800;display:inline-grid;place-items:center;padding:0 5px;font-family:var(--m)}
.fd{border-radius:var(--r);background:var(--glass);border:.5px solid var(--line);padding:12px}
.fd.new{background:linear-gradient(135deg,rgba(255,55,95,.14),rgba(191,90,242,.08));border-color:rgba(255,55,95,.35)}
.fd .fh{display:flex;gap:10px;align-items:center}
.fd .fi{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:var(--grad);color:#fff;flex:none}
.fd .fh b{display:block;font-size:14.5px;font-weight:700;line-height:1.25}
.fd .fh small{color:var(--t3);font-size:11.5px}.fd .fh em{font-style:normal;color:#ff6b88;font-weight:700}
.fd .fb{margin-top:8px;font-size:13.5px;color:var(--t2);line-height:1.45}
.fd .fl{margin-top:10px;display:grid;gap:6px}
.fd .fr{display:flex;gap:10px;align-items:center;text-align:left;padding:6px;border-radius:12px;background:rgba(255,255,255,.05)}

.fd .fr .tx{flex:1;min-width:0}.fd .fr b{display:block;font-size:13.5px;font-weight:650;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fd .fr small{display:block;font-size:11.5px;color:var(--t3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

async function rpc(fn,args){

  if(!r.ok){const e=new Error("http "+r.status);e.http=r.status;throw e}

}
function norm(s){
  S=Object.assign({items:[],votes:[],plan:{},ptime:{},booked:{},archive:{},notes:[],expenses:[],chat:[],meta:{},feed:[]},s||{});S.feed=S.feed||[];
  for(const k of["plan","ptime","booked","archive","meta"])S[k]=S[k]||{};

  V={necmi:{},ahmet:{}};for(const v of S.votes)if(V[v.p])V[v.p][v.i]=v.v;

let flushing=false;
async function flush(){

    try{await rpc(OB[0][0],OB[0][1])}catch(e){if(e.http){toast("Kaydedilemedi ("+e.http+")");}else{break}}
    OB.shift();saveOB();

}
function send(fn,args){OB.push([fn,Object.assign({k:K},args)]);saveOB();netState();flush().then(()=>{if(!OB.length)setTimeout(load,400)})}

async function load(){

}

async function prefetchTiles(){
  // Manhattan (Battery → Central Park North) + DUMBO, zoom 12-15
  const box={n:40.80,s:40.695,w:-74.025,e:-73.935};
  const t2=(lat,lng,z)=>{const n=2**z;const x=Math.floor((lng+180)/360*n);const r=lat*Math.PI/180;const y=Math.floor((1-Math.log(Math.tan(r)+1/Math.cos(r))/Math.PI)/2*n);return[x,y]};
  const urls=[];for(let z=12;z<=15;z++){const [x1,y1]=t2(box.n,box.w,z),[x2,y2]=t2(box.s,box.e,z);for(let x=x1;x<=x2;x++)for(let y=y1;y<=y2;y++)urls.push(`https://tile.openstreetmap.org/${z}/${x}/${y}.png`)}
  toast("⬇ "+urls.length+" harita karosu indiriliyor…");let ok=0;
  for(let i=0;i<urls.length;i+=6){await Promise.all(urls.slice(i,i+6).map(u=>fetch(u,{mode:"no-cors"}).then(()=>ok++).catch(()=>{})));await new Promise(r=>setTimeout(r,120))}
  toast("✓ Harita çevrimdışı için hazır ("+ok+" karo)");
}

function b64u(s){const p="=".repeat((4-s.length%4)%4);const b=atob((s+p).replace(/-/g,"+").replace(/_/g,"/"));return Uint8Array.from([...b].map(c=>c.charCodeAt(0)))}
async function enablePush(){
  const standalone=matchMedia("(display-mode: standalone)").matches||navigator.standalone;
  if(!("serviceWorker" in navigator)||!("PushManager" in window)||!("Notification" in window)){
    toast(/iPhone|iPad/.test(navigator.userAgent)&&!standalone?"iPhone'da: Paylaş → Ana Ekrana Ekle, sonra uygulamayı ana ekrandan açıp tekrar deneyin.":"Bu tarayıcı bildirim desteklemiyor.");return}
  try{
    const perm=await Notification.requestPermission();
    if(perm!=="granted"){toast("Bildirim izni verilmedi. Ayarlar'dan açabilirsiniz.");return}
    const reg=await navigator.serviceWorker.ready;
    let sub=await reg.pushManager.getSubscription();
    if(!sub)sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64u(VAPID)});
    await rpc("trip_push_sub",{k:K,p:ME,s:sub.toJSON()});
    ls("nyc_push","1");renderSign();toast("🔔 Bildirimler açık: yeni öneri, mesaj, not ve rezervasyonlarda haber vereceğim.");
  }catch(e){toast("Bildirim açılamadı: "+(e.message||e))}
}

}
let pendingRender=false;
document.addEventListener("focusout",()=>{if(pendingRender){pendingRender=false;setTimeout(renderSoft,150)}});
function bindView(){
  const v=$("#view");
  v.querySelectorAll("[data-day]").forEach(b=>b.onclick=()=>{selDay=b.dataset.day;ls("nyc_day",selDay);haptic(6);render();animView()});
  v.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>openItem(b.dataset.open));
  v.querySelectorAll("[data-more]").forEach(b=>b.onclick=e=>{e.stopPropagation();openStop(b.dataset.more)});
  v.querySelectorAll("[data-v]").forEach(b=>b.onclick=e=>{e.stopPropagation();const [i,x]=b.dataset.v.split("|");doVote(i,+x)});
  v.querySelectorAll("[data-book]").forEach(b=>b.onclick=()=>doBook(b.dataset.book));
  v.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>{if(b.dataset.grp){openGrp=b.dataset.grp;kFilter="all"}go(b.dataset.go)});
  v.querySelectorAll("[data-kf]").forEach(b=>b.onclick=()=>{kFilter=b.dataset.kf;render()});
  v.querySelectorAll("[data-cref]").forEach(b=>b.onclick=e=>{if(e.target.closest("[data-open]"))return;cmpRef=b.dataset.cref;ls("nyc_cmpref",cmpRef);haptic(6);render()});
  v.querySelectorAll("details.grp").forEach(d=>d.ontoggle=()=>ls("nyc_g_"+d.dataset.g,d.open?"1":"0"));
  v.querySelectorAll("[data-md]").forEach(b=>b.onclick=()=>{mapDay=b.dataset.md;ls("nyc_mday",mapDay);v.querySelectorAll("[data-md]").forEach(x=>x.classList.toggle("on",x===b));drawMap(true)});
  v.querySelectorAll("[data-add]").forEach(b=>b.onclick=()=>openSheet(addSheet(b.dataset.add),"add"));
  v.querySelectorAll("[data-dnote]").forEach(b=>b.onclick=()=>openSheet(dayNoteSheet(b.dataset.dnote),"daynote"));
  v.querySelectorAll("[data-dmap]").forEach(b=>b.onclick=()=>{mapDay=b.dataset.dmap;ls("nyc_mday",mapDay);go("harita")});
  v.querySelectorAll("[data-delnote]").forEach(b=>b.onclick=()=>delNote(+b.dataset.delnote));
  v.querySelectorAll("[data-rm]").forEach(b=>b.onclick=()=>{rezMode=b.dataset.rm;ls("nyc_rezmode",rezMode);render()});
  v.querySelectorAll("[data-exp]").forEach(b=>b.onclick=()=>openExpense({item:b.dataset.exp}));
  v.querySelectorAll("[data-delexp]").forEach(b=>b.onclick=()=>{if(!confirm("Bu harcama silinsin mi?"))return;const id=+b.dataset.delexp;S.expenses=S.expenses.filter(e=>e.id!==id);send("trip_expense",{p:ME,title:"",amount:0,cur:"USD",paid_by:ME,split:"both",item_id:null,cat:null,del:id});renderSoft()});
  const ea=$("#eadd");if(ea)ea.onclick=()=>openExpense({});
  const bs=$("#bset");if(bs)bs.onclick=setBudget;
  const kq=$("#kq");if(kq){kq.oninput=()=>{kQuery=kq.value;clearTimeout(kq._t);kq._t=setTimeout(()=>{const p=kq.selectionStart;render();const n=$("#kq");n.focus();n.setSelectionRange(p,p)},250)}}
}
$("#csend").onclick=()=>{const t=$("#cin");doChat(t.value);t.value="";t.style.height="42px"};
$("#cin").addEventListener("input",e=>{const t=e.target;t.style.height="42px";t.style.height=Math.min(120,t.scrollHeight)+"px"});

/* ---------- gate ---------- */
function gate(){
  const g=$("#gate");g.classList.add("on");
  const snow=`<div class="snow">${Array.from({length:30},(_,i)=>`<i style="position:absolute;left:${(i*37)%100}%;top:${(i*53)%100}%;width:${2+i%3}px;height:${2+i%3}px;border-radius:50%;background:#fff;opacity:${.3+(i%5)/10}"></i>`).join("")}</div>`;
  if(!K){g.innerHTML=snow+`<span class="bul logo" style="width:60px;height:60px;font-size:21px;background:var(--grad);color:#fff">NY</span><h1>Noel'den<br>Yılbaşına</h1><p>Erişim kodunu girin (linkte vardı).</p><input id="gk" placeholder="nyc-…" autocapitalize="off" autocomplete="off"><button class="btn k" id="gok" style="height:50px;width:100%;justify-content:center;font-size:17px">Devam</button>`;
    $("#gok").onclick=()=>{const v=$("#gk").value.trim();if(!v)return;K=v;ls("nyc_k",v);g.classList.remove("on");boot()};return}
  pickPerson();
}
function pickPerson(){
  const g=$("#gate");g.classList.add("on");
  g.innerHTML=`<span class="bul logo" style="width:60px;height:60px;font-size:21px;background:var(--grad);color:#fff">NY</span><h1>Kimsin?</h1><p>Oylar, notlar ve bildirimler kişiye göre ayrılıyor.</p><div class="who">${Object.entries(PPL).map(([k,p])=>`<button data-p="${k}"><span class="bul" style="background:${p.c}">${p.l}</span>${p.n}</button>`).join("")}</div>`;
  g.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>{ME=b.dataset.p;ls("nyc_me",ME);g.classList.remove("on");render();if(ls("nyc_push")==="1")enablePush()})
}

/* ---------- boot ---------- */
function boot(){
  deEmojiNode(document.body);_mo.observe(document.body,{childList:true,subtree:true,characterData:true});
  splash();
  if(!K)return gate();
  try{const c=ls("nyc_state");if(c){norm(JSON.parse(c));}}catch(e){}
  if(!ME)pickPerson();
  if(S)render();else $("#view").innerHTML=`<div class="empty">Yükleniyor…</div>`;
  lastSnap=null;load();loadWx();
  setInterval(()=>{if(!document.hidden)load()},15000);
  document.addEventListener("visibilitychange",()=>{if(!document.hidden){load();renderSign();swUpdate()}});
  setInterval(swUpdate,30*60*1000);
  markSeen();
}
if("serviceWorker" in navigator){
  navigator.serviceWorker.register("sw.js",{updateViaCache:"none"}).then(r=>{r.update().catch(()=>{})}).catch(()=>{});
  const hadCtl=!!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener("controllerchange",()=>{if(!hadCtl||_swReloading)return;_swReloading=true;const ae=document.activeElement;if(ae&&(ae.tagName==="TEXTAREA"||ae.tagName==="INPUT")&&ae.value){toast("✨ Yeni sürüm hazır, uygulamayı yeniden açınca gelecek");return}sessionStorage.setItem("nyc_spl","1");location.reload()});
  navigator.serviceWorker.addEventListener("message",e=>{if(e.data&&e.data.type==="open"&&e.data.tab){if(e.data.tab==="bildirim")openFeed();else go(e.data.tab)}});
}
window.addEventListener("hashchange",()=>{const t=location.hash.slice(1);if(t==="bildirim"){openFeed();return}if(t&&t!==tab&&["hat","rez","kesfet","harita","sohbet"].includes(t)){tab=t;render()}});
boot();
</script>
