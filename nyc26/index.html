<title>NYC Kış '26 · Necmi & Ahmet</title>

<style>
:root{
  --night:#0a1224;--night2:#0f1a33;--ink:#131f3d;--card:#152342;--line:rgba(217,180,90,.18);--line2:rgba(255,255,255,.08);
  --gold:#d9b45a;--gold2:#f3dfa6;--cran:#b3243f;--ever:#1d5a45;--snow:#f6f3ea;--mut:#a5afc8;--dim:#6f7a98;--grn:#4fd69c;--red:#ff7a7a;
  --r:20px;--sh:0 18px 40px -18px rgba(0,0,0,.7);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--night)}
body{margin:0;color:var(--snow);font-family:Inter,system-ui,sans-serif;font-size:15px;min-height:100vh;
 background:radial-gradient(1200px 600px at 80% -10%,rgba(179,36,63,.18),transparent 60%),radial-gradient(900px 500px at -10% 10%,rgba(29,90,69,.22),transparent 60%),var(--night);
 padding-bottom:calc(84px + env(safe-area-inset-bottom))}
a{color:inherit}button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
#snow{position:fixed;inset:0;pointer-events:none;z-index:1}
.wrap{position:relative;z-index:2;max-width:680px;margin:0 auto}
/* hero */
.hero{position:relative;padding:calc(18px + env(safe-area-inset-top)) 20px 0;overflow:hidden}
.kicker{font-size:11px;letter-spacing:4px;text-transform:uppercase;color:var(--gold);font-weight:600;display:flex;align-items:center;gap:10px}
.kicker:before,.kicker:after{content:"";height:1px;flex:0 0 22px;background:linear-gradient(90deg,transparent,var(--gold))}
.kicker:after{background:linear-gradient(90deg,var(--gold),transparent)}
h1{font-family:"Playfair Display",serif;font-weight:800;font-size:40px;line-height:1.02;margin:10px 0 6px;letter-spacing:-.5px}
h1 em{font-style:italic;color:var(--gold2);font-weight:600}
.dates{color:var(--mut);font-size:13px}
.countdown{position:absolute;right:20px;top:calc(22px + env(safe-area-inset-top));text-align:center;border:1px solid var(--line);border-radius:16px;padding:8px 12px;background:rgba(10,18,36,.55);backdrop-filter:blur(8px)}
.countdown b{display:block;font-family:"Playfair Display",serif;font-size:28px;color:var(--gold2);line-height:1}
.countdown span{font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--mut)}
.skyline{display:block;width:100%;height:120px;margin-top:6px}
.people{display:flex;gap:8px;padding:12px 20px 4px;flex-wrap:wrap}
.pp{display:flex;align-items:center;gap:8px;background:rgba(21,35,66,.7);border:1px solid var(--line2);border-radius:99px;padding:5px 12px 5px 5px;font-size:12px;color:var(--mut)}
.pp i{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-weight:700;font-size:12px;color:var(--night)}
.pp.me{border-color:var(--gold);color:var(--snow)}
.banner{margin:10px 20px 0;padding:12px 14px;border-radius:14px;background:linear-gradient(135deg,rgba(217,180,90,.18),rgba(179,36,63,.15));border:1px solid var(--line);font-size:13px;display:none}
.banner.show{display:block}
main{padding:6px 16px 30px}
.view{display:none;animation:fade .35s ease}.view.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.sec{display:flex;align-items:flex-end;justify-content:space-between;margin:26px 4px 12px}
.sec h2{font-family:"Playfair Display",serif;font-size:24px;margin:0;font-weight:700}
.sec h2 small{display:block;font-family:Inter;font-size:11px;letter-spacing:2.5px;text-transform:uppercase;color:var(--gold);font-weight:600;margin-bottom:4px}
.sec .r{font-size:12px;color:var(--mut)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 2px 6px;scrollbar-width:none;margin:0 -16px;padding-left:18px;padding-right:18px}
.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;padding:9px 14px;border-radius:99px;background:rgba(21,35,66,.8);border:1px solid var(--line2);font-size:13px;color:var(--mut)}
.chip.on{background:var(--gold);color:#1d1503;border-color:var(--gold);font-weight:700}
/* card */
.card{position:relative;background:linear-gradient(180deg,rgba(25,40,74,.95),rgba(19,31,61,.95));border:1px solid var(--line2);border-radius:var(--r);overflow:hidden;margin-bottom:16px;box-shadow:var(--sh)}
.card.both{border-color:rgba(79,214,156,.55);box-shadow:0 0 0 1px rgba(79,214,156,.25),var(--sh)}
.card.must:before{content:"";position:absolute;inset:0;border-radius:var(--r);padding:1px;background:linear-gradient(135deg,var(--gold),transparent 40%,transparent 60%,var(--gold));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
.vis{position:relative;height:168px;overflow:hidden}
.vis svg{position:absolute;inset:0;width:100%;height:100%}
.vis .badge{position:absolute;left:14px;top:14px;display:flex;gap:6px;flex-wrap:wrap;z-index:2}
.b{font-size:10.5px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;padding:5px 9px;border-radius:8px;backdrop-filter:blur(6px)}
.b.both{background:var(--grn);color:#062517}.b.urg{background:var(--cran);color:#fff}.b.must{background:var(--gold);color:#1d1503}.b.new{background:#fff;color:var(--night)}
.vis .cat{position:absolute;left:14px;bottom:12px;z-index:2;font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--gold2);font-weight:600;text-shadow:0 2px 8px rgba(0,0,0,.6)}
.vis .emo{position:absolute;right:16px;bottom:10px;font-size:44px;z-index:2;filter:drop-shadow(0 6px 14px rgba(0,0,0,.5))}
.body{padding:14px 16px 16px}
.ttl{font-family:"Playfair Display",serif;font-weight:700;font-size:21px;line-height:1.2}
.sub{color:var(--gold2);font-size:12.5px;margin-top:4px;opacity:.9}
.desc{font-size:14px;line-height:1.55;color:#d6dcec;margin-top:8px}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.m{font-size:12px;background:rgba(10,18,36,.55);border:1px solid var(--line2);padding:5px 9px;border-radius:9px;color:#d2d9ea}
.m.price{color:var(--gold2);border-color:var(--line)}.m.rate{color:var(--grn)}.m.book{color:#ffc2c2;border-color:rgba(179,36,63,.45)}
.acts{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:10px 13px;border-radius:12px;background:rgba(10,18,36,.6);border:1px solid var(--line2);text-decoration:none}
.btn.pri{background:linear-gradient(135deg,var(--gold),#b8913a);color:#1d1503;border:0}
select{font:inherit;font-size:13px;background:rgba(10,18,36,.6);color:var(--snow);border:1px solid var(--line2);border-radius:12px;padding:9px 10px}
.tix{margin-top:14px;border-radius:14px;padding:12px 14px;background:linear-gradient(135deg,rgba(179,36,63,.22),rgba(217,180,90,.12));border:1px dashed rgba(217,180,90,.55)}
.tix.done{background:rgba(79,214,156,.12);border:1px solid rgba(79,214,156,.5)}
.tix .tl{font-size:10.5px;letter-spacing:1.5px;text-transform:uppercase;color:var(--gold);font-weight:700}
.tix.done .tl{color:var(--grn)}
.tix .tp{font-family:"Playfair Display",serif;font-size:18px;font-weight:700;margin-top:4px;color:var(--gold2)}
.tix .tb{font-size:13px;color:#ffd0d8;margin-top:3px}
.tix .tbtn{margin-top:10px;font-size:12.5px;font-weight:700;padding:8px 12px;border-radius:10px;background:rgba(10,18,36,.6);border:1px solid var(--line)}
.todo{width:100%;border-collapse:collapse;font-size:13px;background:rgba(19,31,61,.85);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-bottom:8px}
.todo td{padding:10px 12px;border-top:1px solid var(--line2);vertical-align:top}
.todo tr:first-child td{border-top:0}
.todo .ok{color:var(--grn);font-weight:700}.todo .no{color:#ffb3c0;font-weight:700}
.todo b{display:block;font-size:13.5px}.todo span{color:var(--mut);font-size:12px}
.vis.ph{height:230px}
.gal{position:absolute;inset:0;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.gal::-webkit-scrollbar{display:none}
.gal img{flex:0 0 100%;width:100%;height:100%;object-fit:cover;scroll-snap-align:start}
.vis.ph:after{content:"";position:absolute;inset:auto 0 0 0;height:70px;background:linear-gradient(transparent,rgba(10,18,36,.85));pointer-events:none}
.gcount{position:absolute;right:12px;top:12px;z-index:2;font-size:11px;font-weight:700;background:rgba(0,0,0,.55);padding:4px 8px;border-radius:8px;backdrop-filter:blur(6px)}
.vis.ph .emo{display:none}
.vote{display:flex;gap:10px;margin-top:14px;padding-top:14px;border-top:1px solid var(--line2)}
.vb{flex:1;padding:12px;border-radius:14px;background:rgba(10,18,36,.55);border:1px solid var(--line2);display:flex;align-items:center;justify-content:center;gap:8px;font-weight:600;font-size:14px;color:var(--mut);transition:transform .12s}
.vb:active{transform:scale(.96)}
.vb.up.on{background:rgba(79,214,156,.16);border-color:var(--grn);color:var(--grn)}
.vb.dn.on{background:rgba(255,122,122,.13);border-color:var(--red);color:var(--red)}
.others{font-size:12px;color:var(--mut);margin-top:10px;display:flex;gap:10px}
/* plan */
.flight{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;background:linear-gradient(135deg,rgba(217,180,90,.12),rgba(21,35,66,.8));border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:10px}
.flight .c{font-family:"Playfair Display",serif;font-size:28px;font-weight:700}
.flight .s{font-size:11px;color:var(--mut);letter-spacing:1px;text-transform:uppercase}
.flight .mid{text-align:center;font-size:11px;color:var(--gold2)}
.flight .mid div{font-size:20px}
.flight .rt{text-align:right}
.must-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:6px}
.mbox{border-radius:16px;padding:14px;border:1px solid var(--line);background:rgba(21,35,66,.75)}
.mbox b{font-family:"Playfair Display",serif;font-size:17px;display:block}
.mbox span{font-size:12px;color:var(--mut)}
.mbox.ok{border-color:rgba(79,214,156,.5)}.mbox.ok span{color:var(--grn)}
.day{position:relative;background:rgba(19,31,61,.85);border:1px solid var(--line2);border-radius:var(--r);padding:14px 16px 8px;margin-bottom:12px}
.dayh{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.dayh .d{display:flex;align-items:baseline;gap:10px}
.dayh .n{font-family:"Playfair Display",serif;font-size:30px;font-weight:800;color:var(--gold2);line-height:1}
.dayh .w{font-size:13px;font-weight:600}.dayh .w small{display:block;color:var(--mut);font-weight:500;font-size:11px}
.dayh .tag{font-size:10.5px;letter-spacing:1px;text-transform:uppercase;padding:4px 8px;border-radius:8px;background:rgba(179,36,63,.25);color:#ffc9d2}
.row{display:flex;gap:12px;align-items:center;padding:11px 0;border-top:1px solid var(--line2)}
.row:first-of-type{border-top:0}
.row .t{font-size:12px;color:var(--gold);min-width:42px;font-weight:700}
.row .x{flex:1;min-width:0}.row .x b{font-size:14px;font-weight:600;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.row .x span{font-size:12px;color:var(--mut)}
.row a{font-size:18px;text-decoration:none;padding:4px}
.empty{color:var(--dim);font-size:13px;padding:8px 0 12px}
.info{background:rgba(19,31,61,.85);border:1px solid var(--line2);border-radius:var(--r);padding:14px 16px;font-size:13.5px;color:#d2d9ea;line-height:1.55;margin-bottom:12px}
.info b{color:var(--gold2)}
/* map */
#lmap{height:62vh;min-height:380px;border-radius:var(--r);border:1px solid var(--line);overflow:hidden;box-shadow:var(--sh);background:#0a1224}
.leaflet-container{font-family:Inter,sans-serif}
.leaflet-tile-pane{filter:invert(1) hue-rotate(195deg) brightness(.9) contrast(.85) saturate(.6)}
.leaflet-tooltip{background:#152342;color:#f6f3ea;border:1px solid rgba(217,180,90,.4);font-weight:600}
.leaflet-control-attribution{background:rgba(10,18,36,.7)!important;color:#8892ad!important}.leaflet-control-attribution a{color:#d9b45a!important}
.pin{width:34px;height:34px;border-radius:50% 50% 50% 4px;transform:rotate(-45deg);background:var(--c);display:grid;place-items:center;border:2px solid #0a1224;box-shadow:0 4px 12px rgba(0,0,0,.5)}
.pin>*{transform:rotate(45deg)}.pin{font-size:15px;font-weight:800;color:#0a1224}
.pin.sel{border-color:#fff;transform:rotate(-45deg) scale(1.2)}
.pin.ok{box-shadow:0 0 0 6px rgba(79,214,156,.25),0 4px 12px rgba(0,0,0,.5)}
#map{border-radius:var(--r);border:1px solid var(--line);overflow:hidden;box-shadow:var(--sh)}
#map svg{display:block;width:100%;height:auto}
.legend{display:flex;flex-wrap:wrap;gap:10px;margin:12px 2px}
.legend span{font-size:12px;color:var(--mut);display:flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:50%;display:inline-block}
/* chat */
.chat{display:flex;flex-direction:column;gap:10px;padding-bottom:120px}
.msg{max-width:84%;padding:11px 14px;border-radius:18px;font-size:14px;line-height:1.5;white-space:pre-wrap}
.msg.me{align-self:flex-end;background:linear-gradient(135deg,#2c4a86,#24396a);border-bottom-right-radius:6px}
.msg.them{align-self:flex-start;background:var(--card);border:1px solid var(--line2);border-bottom-left-radius:6px}
.msg.ai{align-self:flex-start;background:linear-gradient(135deg,rgba(217,180,90,.18),rgba(21,35,66,.9));border:1px solid var(--line);border-bottom-left-radius:6px}
.msg .w{font-size:11px;color:var(--gold2);margin-bottom:4px;font-weight:600;letter-spacing:.3px}
.composer{position:fixed;left:0;right:0;bottom:calc(68px + env(safe-area-inset-bottom));z-index:25;padding:10px 12px;background:rgba(10,18,36,.92);backdrop-filter:blur(12px);border-top:1px solid var(--line2);display:none}
.composer.on{display:block}
.composer .in{max-width:680px;margin:0 auto;display:flex;gap:8px}
.composer textarea{flex:1;resize:none;height:46px;border-radius:14px;background:var(--ink);border:1px solid var(--line2);color:var(--snow);padding:12px 14px;font:inherit;font-size:14px}
.composer button{border-radius:14px;padding:0 16px;font-weight:700;background:linear-gradient(135deg,var(--gold),#b8913a);color:#1d1503}
/* nav */
nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(8,14,29,.94);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav .in{max-width:680px;margin:0 auto;display:flex}
nav button{flex:1;padding:10px 0 11px;font-size:10.5px;letter-spacing:.3px;color:var(--dim);display:flex;flex-direction:column;align-items:center;gap:4px;position:relative}
nav button .i{font-size:20px;filter:grayscale(.6);opacity:.8}
nav button.on{color:var(--gold2)}nav button.on .i{filter:none;opacity:1}
nav button.on:after{content:"";position:absolute;top:0;left:30%;right:30%;height:2px;background:var(--gold);border-radius:2px}
nav .dot{position:absolute;top:6px;right:calc(50% - 18px);width:8px;height:8px;border-radius:50%;background:var(--cran);display:none}
nav .dot.on{display:block}
/* gate */
#gate{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;padding:24px;background:radial-gradient(800px 500px at 50% 0%,rgba(179,36,63,.25),transparent),var(--night)}
#gate.on{display:flex}
.gbox{width:100%;max-width:380px;text-align:center}
.gbox h2{font-family:"Playfair Display",serif;font-size:34px;margin:14px 0 6px}
.gbox p{color:var(--mut);font-size:14px;line-height:1.5;margin:0 0 22px}
.who2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.who2 button{padding:22px 10px;border-radius:20px;background:var(--card);border:1px solid var(--line);font-family:"Playfair Display",serif;font-size:22px;font-weight:700}
.who2 button i{display:block;font-style:normal;font-size:34px;margin-bottom:8px}
.gbox input{width:100%;padding:14px;border-radius:14px;background:var(--ink);border:1px solid var(--line);color:var(--snow);font:inherit;text-align:center;margin-bottom:12px}
.status{font-size:12px;color:var(--dim);text-align:center;padding:16px}
.foot{text-align:center;font-size:11px;color:var(--dim);padding:10px 0 0}
</style>
</head>

<script>
const SB="https://qbvsboendmzpkudbchaf.supabase.co", KEY="sb_publishable_iIcN6U9ibLZ_FBXEY2IXGQ_-45R1TWp";
const DAYS=[["2026-12-25","25","Cuma","Varış · Noel"],["2026-12-26","26","Cumartesi",""],["2026-12-27","27","Pazar",""],["2026-12-28","28","Pazartesi",""],["2026-12-29","29","Salı",""],["2026-12-30","30","Çarşamba","Sahne gecesi"],["2026-12-31","31","Perşembe","Yılbaşı"],["2027-01-01","1","Cuma","Son gün · gece uçuş"]];
const CATS={
 otel:{n:"Konaklama",e:"🏨",g:["#1b2a52","#3b2f6b"],dot:"#b9a6ff",art:"hotel"},
 ozel:{n:"Özel gün",e:"🎄",g:["#4a0f1e","#9e1b32"],dot:"#ff8095",art:"tree"},
 caz:{n:"Caz",e:"🎷",g:["#2a1606","#7a4a12"],dot:"#f0b44c",art:"jazz"},
 broadway:{n:"Broadway",e:"🎭",g:["#3b0716","#8a1230"],dot:"#ff5c7a",art:"curtain"},
 sahne:{n:"Sahne",e:"🩰",g:["#2b0f3d","#6a2a8a"],dot:"#d58cff",art:"curtain"},
 yemek:{n:"Yeme-İçme",e:"🍽️",g:["#3a1a08","#a3541c"],dot:"#ffad66",art:"plate"},
 manzara:{n:"Manzara",e:"🌆",g:["#071a33","#1f5c9a"],dot:"#7ab8ff",art:"city"},
 muze:{n:"Müze & Sanat",e:"🖼️",g:["#0d2a20","#2a7356"],dot:"#5fe0a8",art:"frame"},
 deneyim:{n:"Deneyim",e:"⛸️",g:["#0a2a33","#1f7f8f"],dot:"#6ee6f0",art:"snowflake"},
 ucus:{n:"Uçuş",e:"✈️",g:["#141e3a","#3a4a7a"],dot:"#cfd6e8",art:"city"}
};
const BOUNDS={w:-74.035,e:-73.925,s:40.665,n:40.815};
let K=null,ME=null,items=[],votes={necmi:{},ahmet:{}},plan={},booked={},chat=[],meta={},tab="plan",filter="all",mapSel=null,lastSig="";
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const NAME={necmi:"Necmi",ahmet:"Ahmet"}, COL={necmi:"#d9b45a",ahmet:"#7ab8ff"};
const OTHER=()=>ME==="necmi"?"ahmet":"necmi";
function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}}

/* ---------- api ---------- */
async function rpc(fn,args){const r=await fetch(SB+"/rest/v1/rpc/"+fn,{method:"POST",headers:{apikey:KEY,Authorization:"Bearer "+KEY,"Content-Type":"application/json"},body:JSON.stringify(args)});
  if(!r.ok)throw new Error(await r.text());const t=await r.text();return t?JSON.parse(t):null}
async function load(){
  try{const s=await rpc("trip_state",{k:K});const sig=JSON.stringify(s);if(sig===lastSig)return;lastSig=sig;
    items=s.items||[];plan=s.plan||{};booked=s.booked||{};chat=s.chat||[];meta=(s.meta||{}).info||{};
    const v={necmi:{},ahmet:{}};(s.votes||[]).forEach(x=>{(v[x.p]=v[x.p]||{})[x.i]=x.v});
    if(pending.size){for(const [id,val] of pending){if(val)v[ME][id]=val;else delete v[ME][id]}}
    votes=v;notify();render();
  }catch(e){if(String(e).includes("bad key")){ls("nyc_k","");K=null;gate()}else if(!items.length)$("#v-plan").innerHTML='<div class="status">Bağlantı kurulamadı, tekrar deneniyor…</div>'}
}
/* ---------- helpers ---------- */
function mv(id){return (votes[ME]||{})[id]||0}
function ov(id){return (votes[OTHER()]||{})[id]||0}
function both(id){return mv(id)===1&&ov(id)===1}
function score(i){return (mv(i.id)===1)+(ov(i.id)===1)-(mv(i.id)===-1)-(ov(i.id)===-1)+(i.must?.3:0)+(i.urgent?.2:0)}
const byScore=a=>[...a].sort((x,y)=>score(y)-score(x));
function mapsUrl(it){return "https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(it.title.split("·")[0]+" "+(it.addr||"")+" New York")}
const pad=n=>String(n).padStart(2,"0");
function calUrl(it,day){const d=(day||it.when||"").replace(/-/g,"");if(!d)return null;const tm=(it.time||"19:00").replace(":","");
  const e=new Date(Date.UTC(+d.slice(0,4),+d.slice(4,6)-1,+d.slice(6,8),+tm.slice(0,2),+tm.slice(2,4)+(it.dur||120)));
  const en=e.getUTCFullYear()+pad(e.getUTCMonth()+1)+pad(e.getUTCDate())+"T"+pad(e.getUTCHours())+pad(e.getUTCMinutes())+"00";
  return "https://calendar.google.com/calendar/render?"+new URLSearchParams({action:"TEMPLATE",text:it.title,dates:d+"T"+tm+"00/"+en,ctz:"America/New_York",location:it.addr||"",details:(it.desc||"")+(it.url?"\n"+it.url:"")})}
function dayLabel(d){const x=DAYS.find(z=>z[0]===d);return x?x[1]+" "+(x[0].startsWith("2027")?"Oca":"Ara")+" "+x[2]:d}
function hash(s){let h=7;for(const c of s)h=(h*31+c.charCodeAt(0))%100003;return h}

/* ---------- illustrations ---------- */
function art(it){
  const C=CATS[it.cat]||CATS.deneyim,h=hash(it.id),id="g"+h;
  let stars="";for(let i=0;i<22;i++){const x=(h*(i+3)*7)%400,y=(h*(i+5)*3)%90;stars+=`<circle cx="${x}" cy="${y}" r="${i%5?0.8:1.6}" fill="#fff" opacity="${.3+(i%4)*.15}"/>`}
  let city="";let x=0;while(x<400){const w=18+((h+x)*13)%26,ht=40+((h*x+7)%70);city+=`<rect x="${x}" y="${168-ht}" width="${w}" height="${ht}" fill="rgba(5,10,22,.55)"/>`;
    for(let wy=168-ht+8;wy<160;wy+=10)for(let wx=x+4;wx<x+w-4;wx+=7)if((wx*wy+h)%5===0)city+=`<rect x="${wx}" y="${wy}" width="2.5" height="4" fill="#ffd98a" opacity=".55"/>`;x+=w+2}
  const motif={
   tree:`<g transform="translate(300 20)" opacity=".9"><path d="M40 0l6 12-6-3-6 3z" fill="#f3dfa6"/><path d="M40 14l26 36H14z M40 34l32 42H8z M40 58l38 46H2z" fill="#0f3b2e" stroke="#1d5a45"/>${[...Array(9)].map((_,i)=>`<circle cx="${14+((h*(i+2))%52)}" cy="${30+i*8}" r="3" fill="${["#d9b45a","#ff5c7a","#fff"][i%3]}"/>`).join("")}</g>`,
   jazz:`<g transform="translate(270 30)" fill="none" stroke="#f3dfa6" stroke-width="3" opacity=".85"><path d="M10 90 C40 90 50 60 60 40 L95 10"/><path d="M95 10 l18 -6 -6 18z" fill="#f3dfa6"/><circle cx="20" cy="95" r="14"/><path d="M-40 30 q10 -12 20 0 t20 0" opacity=".6"/><path d="M-30 60 q10 -12 20 0 t20 0" opacity=".4"/></g>`,
   curtain:`<g opacity=".95"><path d="M0 0h400v14H0z" fill="#d9b45a"/>${[...Array(8)].map((_,i)=>`<path d="M${i*25} 14 q12 80 0 154 h25 q-12 -74 0 -154z" fill="${i%2?"#7a0f26":"#9e1b32"}"/>`).join("")}${[...Array(8)].map((_,i)=>`<path d="M${400-i*25} 14 q-12 80 0 154 h-25 q12 -74 0 -154z" fill="${i%2?"#7a0f26":"#9e1b32"}"/>`).join("")}<ellipse cx="200" cy="168" rx="80" ry="20" fill="#f3dfa6" opacity=".25"/></g>`,
   plate:`<g transform="translate(290 34)" opacity=".85"><circle cx="50" cy="56" r="48" fill="none" stroke="#f3dfa6" stroke-width="2"/><circle cx="50" cy="56" r="34" fill="none" stroke="#f3dfa6" stroke-width="1" opacity=".6"/><path d="M-6 16v34M-12 16v18q6 6 12 0V16M110 16q10 10 0 40v34" stroke="#f3dfa6" stroke-width="2.5" fill="none"/></g>`,
   city:`<g transform="translate(280 6)" fill="#f3dfa6" opacity=".9"><path d="M60 0l3 22h-6zM55 22h10v14H55zM50 36h20v14H50zM44 50h32v112H44z"/><rect x="88" y="70" width="22" height="92" opacity=".6"/><rect x="18" y="86" width="22" height="76" opacity=".5"/></g>`,
   frame:`<g transform="translate(270 22)" opacity=".9"><rect x="0" y="0" width="110" height="80" fill="none" stroke="#d9b45a" stroke-width="6"/><path d="M8 70l30-34 22 22 16-14 26 26z" fill="#2a7356"/><circle cx="78" cy="22" r="9" fill="#f3dfa6"/></g>`,
   hotel:`<g transform="translate(286 14)" opacity=".92"><rect x="0" y="10" width="90" height="150" fill="rgba(243,223,166,.12)" stroke="#d9b45a"/>${[...Array(8)].map((_,r)=>[...Array(4)].map((_,c)=>`<rect x="${10+c*20}" y="${22+r*16}" width="10" height="9" fill="#ffd98a" opacity="${(r*c+h)%3?.75:.2}"/>`).join("")).join("")}<path d="M-6 10h102l-8-10H2z" fill="#d9b45a"/></g>`,
   snowflake:`<g transform="translate(330 60)" stroke="#e6f6ff" stroke-width="2.5" opacity=".85">${[0,60,120].map(a=>`<g transform="rotate(${a})"><path d="M0 -44V44M-10 -32l10 8 10-8M-10 32l10-8 10 8"/></g>`).join("")}</g>`
  }[C.art]||"";
  return `<svg viewBox="0 0 400 168" preserveAspectRatio="xMidYMid slice"><defs><linearGradient id="${id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${C.g[0]}"/><stop offset="1" stop-color="${C.g[1]}"/></linearGradient><radialGradient id="${id}r" cx=".85" cy=".1" r=".7"><stop offset="0" stop-color="#fff" stop-opacity=".18"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient></defs><rect width="400" height="168" fill="url(#${id})"/><rect width="400" height="168" fill="url(#${id}r)"/>${stars}${C.art!=="curtain"?city:""}${motif}<rect y="120" width="400" height="48" fill="url(#${id}f)" opacity="0"/></svg>`;
}

/* ---------- card ---------- */
function card(it){
  const C=CATS[it.cat]||CATS.deneyim,m=mv(it.id),o=ov(it.id),B=both(it.id),isNew=(it.addedAt||0)>seenAt;
  const cal=calUrl(it,plan[it.id]);
  const dsel=!it.when&&it.cat!=="otel"?`<select data-day="${esc(it.id)}"><option value="">📅 Güne ata</option>${DAYS.map(d=>`<option value="${d[0]}" ${plan[it.id]===d[0]?"selected":""}>${dayLabel(d[0])}</option>`).join("")}</select>`:"";
  const oTxt=o?`<span><b style="color:${COL[OTHER()]}">${NAME[OTHER()]}</b> ${o===1?"👍 beğendi":"👎 geçti"}</span>`:`<span>${NAME[OTHER()]} henüz oy vermedi</span>`;
  return `<article class="card ${B?"both":""} ${it.must?"must":""}">
   <div class="vis ${it.photos&&it.photos.length?"ph":""}">${it.photos&&it.photos.length?`<div class="gal">${it.photos.map((u,k)=>`<img loading="lazy" src="${esc(u)}" alt="${esc(it.title)} fotoğraf ${k+1}">`).join("")}</div><div class="gcount">📷 ${it.photos.length} · kaydır</div>`:art(it)}<div class="badge">${B?'<span class="b both">💚 İkiniz de</span>':""}${it.must?'<span class="b must">★ Olmazsa olmaz</span>':""}${it.urgent&&!B?'<span class="b urg">⏰ Erken rez.</span>':""}${it.by?`<span class="b new">${NAME[it.by]||it.by} buldu</span>`:""}${isNew?'<span class="b new">Yeni</span>':""}</div>
   <div class="cat" lang="en">${esc(C.n)}${it.area?" · "+esc(it.area):""}</div><div class="emo">${esc(it.emoji||C.e)}</div></div>
   <div class="body"><div class="ttl">${esc(it.title)}</div>${it.sub?`<div class="sub">${esc(it.sub)}</div>`:""}
    ${it.desc?`<div class="desc">${esc(it.desc)}</div>`:""}
    <div class="meta">${it.when?`<span class="m">📅 ${esc(dayLabel(it.when))}${it.time?" · "+esc(it.time):""}</span>`:(plan[it.id]?`<span class="m">📅 ${esc(dayLabel(plan[it.id]))}</span>`:"")}
     ${it.rating?`<span class="m rate">★ ${esc(it.rating)}</span>`:""}${it.addr?`<span class="m">📍 ${esc(it.addr)}</span>`:""}
     ${it.source==="chat"?'<span class="m">💬 sohbetten geldi</span>':""}</div>
    ${(it.price||it.book)?`<div class="tix ${booked[it.id]?"done":""}"><div class="tl">${booked[it.id]?"✅ Alındı · "+NAME[booked[it.id]]:(it.book?"🎟️ Rezervasyon / bilet":"💰 Fiyat")}</div>
      ${it.price?`<div class="tp">${esc(it.price)}</div>`:""}${it.book?`<div class="tb">${esc(it.book)}</div>`:""}
      ${it.book?`<button class="tbtn" data-book="${esc(it.id)}">${booked[it.id]?"Geri al":"✓ Aldık / rezervasyon yapıldı"}</button>`:""}</div>`:""}
    <div class="acts">${it.url?`<a class="btn pri" href="${esc(it.url)}" target="_blank" rel="noopener">${it.cat==="otel"?"Rezervasyon":"Bilet / Detay"} ↗</a>`:""}
     ${it.cat!=="ucus"?`<a class="btn" href="${esc(mapsUrl(it))}" target="_blank" rel="noopener">🗺️ Konum</a>`:""}
     ${cal?`<a class="btn" href="${esc(cal)}" target="_blank" rel="noopener">📆 Takvime</a>`:""}${dsel}</div>
    ${it.cat!=="ucus"?`<div class="vote"><button class="vb up ${m===1?"on":""}" data-vote="${esc(it.id)}" data-s="1">👍 Beğendim</button><button class="vb dn ${m===-1?"on":""}" data-vote="${esc(it.id)}" data-s="-1">👎 Geç</button></div><div class="others">${oTxt}</div>`:""}
   </div></article>`;
}

/* ---------- views ---------- */
function sec(k,t,r){return `<div class="sec"><h2><small>${k}</small>${t}</h2><div class="r">${r||""}</div></div>`}
function rPlan(){
  const hotels=items.filter(i=>i.cat==="otel"),pick=hotels.filter(h=>both(h.id));
  const jazzOk=items.some(i=>i.cat==="caz"&&(plan[i.id]||i.when)&&both(i.id)), bwOk=items.some(i=>i.cat==="broadway"&&(plan[i.id]||i.when)&&both(i.id));
  let h=`<div class="flight"><div><div class="s">İstanbul</div><div class="c">IST</div><div class="s">25 Ara · 08:05</div></div><div class="mid"><div>✈︎</div>TK3 · 11J</div><div class="rt"><div class="s">New York</div><div class="c">JFK</div><div class="s">10:55</div></div></div>
  <div class="flight"><div><div class="s">New York</div><div class="c">JFK</div><div class="s">2 Oca · 00:20</div></div><div class="mid"><div>✈︎</div>TK12 · 14A</div><div class="rt"><div class="s">İstanbul</div><div class="c">IST</div><div class="s">18:10</div></div></div>
  <div class="acts" style="margin:0 0 6px">${items.filter(i=>i.cat==="ucus").map(f=>`<a class="btn" href="${esc(calUrl(f))}" target="_blank" rel="noopener">📆 ${esc(f.title.split(" ")[0])} takvime</a>`).join("")}</div>`;
  h+=sec("Olmazsa olmazlar","Caz & Broadway");
  h+=`<div class="must-row"><div class="mbox ${jazzOk?"ok":""}"><b>🎷 Caz barı</b><span>${jazzOk?"Programda ✓":"İkiniz de 👍 verip bir güne atayın"}</span></div><div class="mbox ${bwOk?"ok":""}"><b>🎭 Broadway</b><span>${bwOk?"Programda ✓":"Bir müzikal seçin ve güne atayın"}</span></div></div>`;
  h+=sec("Konaklama","Otel",pick.length?"✅ seçildi":hotels.length+" seçenek");
  h+=pick.length?pick.map(card).join(""):`<div class="info">İkinizin de 👍 verdiği otel burada sabitlenir. <b>Not:</b> dönüş uçağı 1 Ocak gecesi 00:20; otelden 1 Ocak'ta çıkıp bagajı emanete bırakın ya da geç çıkış isteyin.</div>`+byScore(hotels).map(card).join("");
  h+=sec("Gün gün","Program","sabit + atadıklarınız");
  for(const [d,n,w,tag] of DAYS){
    const list=items.filter(i=>i.cat!=="otel"&&((i.when===d&&(i.cat==="ucus"||i.pinned||mv(i.id)===1||ov(i.id)===1))||plan[i.id]===d)).sort((a,b)=>(a.time||"99").localeCompare(b.time||"99"));
    h+=`<div class="day"><div class="dayh"><div class="d"><span class="n">${n}</span><span class="w">${d.startsWith("2027")?"Ocak":"Aralık"}<small>${w}</small></span></div>${tag?`<span class="tag">${tag}</span>`:""}</div>`;
    if(!list.length)h+=`<div class="empty">Boş. Keşfet'ten beğendiklerinizi bu güne atayın.</div>`;
    for(const it of list){const u=calUrl(it,plan[it.id]);h+=`<div class="row"><div class="t">${esc(it.time||"—")}</div><div class="x"><b>${both(it.id)?"💚 ":""}${esc(it.emoji||CATS[it.cat]?.e||"")} ${esc(it.title)}</b><span>${esc(it.area||"")}</span></div>${it.cat!=="ucus"?`<a href="${esc(mapsUrl(it))}" target="_blank" rel="noopener">🗺️</a>`:""}${u?`<a href="${esc(u)}" target="_blank" rel="noopener">📆</a>`:""}</div>`}
    h+=`</div>`}
  const fav=items.filter(i=>both(i.id)&&!i.when&&!plan[i.id]&&i.cat!=="otel");
  if(fav.length)h+=sec("Ortak favoriler","Güne atanmayı bekleyenler",fav.length)+fav.map(card).join("");
  h+=`<div class="foot">${meta.updatedAt?"Son güncelleme: "+new Date(meta.updatedAt).toLocaleString("tr-TR",{day:"numeric",month:"long",hour:"2-digit",minute:"2-digit"}):""}${meta.note?" · "+esc(meta.note):""}</div>`;
  $("#v-plan").innerHTML=h;
}
function rOzel(){
  const G=[["2026-12-25","25 Aralık","Noel akşamı"],["2026-12-30","30 Aralık","Sahne gecesi"],["2026-12-31","31 Aralık","Yılbaşı gecesi"],["*","Tarihi esnek","Erken bilet şart"]];
  const need=items.filter(i=>i.book&&(both(i.id)||mv(i.id)===1||ov(i.id)===1)).sort((a,b)=>(a.when||a.for||plan[a.id]||"9").localeCompare(b.when||b.for||plan[b.id]||"9"));
  let h=`<div class="info">Tükenen ya da önceden rezervasyon isteyen her şey burada. İkiniz de 👍 verince kart yeşile döner; sonra <b>Bilet</b> düğmesinden alıp <b>✓ Aldık</b> diye işaretleyin.</div>`;
  if(need.length){const done=need.filter(i=>booked[i.id]).length;
    h+=sec("Yapılacaklar","Rezervasyon listesi",done+"/"+need.length+" tamam")+`<table class="todo">${need.map(i=>`<tr><td class="${booked[i.id]?"ok":"no"}">${booked[i.id]?"✓":"○"}</td><td><b>${esc(i.title)}</b><span>${esc(dayLabel(i.when||plan[i.id]||i.for||""))}${i.price?" · "+esc(i.price):""}</span></td><td>${i.url?`<a href="${esc(i.url)}" target="_blank" rel="noopener">↗</a>`:""}</td></tr>`).join("")}</table>`}
  for(const [d,k,t] of G){const g=items.filter(i=>i.urgent&&i.cat!=="otel"&&(d==="*"?!i.when&&!i.for:(i.when===d||i.for===d)));if(!g.length)continue;h+=sec(k,t,g.length+" seçenek")+byScore(g).map(card).join("")}
  $("#v-ozel").innerHTML=h;
}
function rKesfet(){
  const cs=["all","new","caz","broadway","yemek","manzara","sahne","muze","deneyim","ozel","otel"];
  let h=`<div class="chips">${cs.map(c=>`<button class="chip ${filter===c?"on":""}" data-f="${c}">${c==="all"?"Tümü":c==="new"?"🆕 Oy vermediklerim":CATS[c].e+" "+CATS[c].n}</button>`).join("")}</div>`;
  let l=items.filter(i=>i.cat!=="ucus");if(filter==="new")l=l.filter(i=>!mv(i.id));else if(filter!=="all")l=l.filter(i=>i.cat===filter);
  h+=l.length?byScore(l).map(card).join(""):`<div class="empty">Bu filtrede bir şey kalmadı. 🎉</div>`;
  $("#v-kesfet").innerHTML=h;
}
let LM=null,LL=null,mapDay="all";
function rHarita(){
  const V=$("#v-harita");
  if(!window.L){V.innerHTML='<div class="info">Harita yüklenemedi; internet bağlantını kontrol et. Kartlardaki <b>Konum</b> düğmesi Google Maps\'te açar.</div>';return}
  if(!LM){
    V.innerHTML=`${sec("Şehir","Harita","")}<div class="chips" id="mdays"></div><div id="lmap"></div><div class="legend" id="mleg"></div><div id="mapcard"></div>`;
    LM=L.map("lmap",{zoomControl:false,attributionControl:true}).setView([40.735,-73.985],12);
    L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"© OpenStreetMap"}).addTo(LM);
    L.control.zoom({position:"bottomright"}).addTo(LM);
    LL=L.layerGroup().addTo(LM);
  }
  setTimeout(()=>LM.invalidateSize(),60);
  $("#mdays").innerHTML=[["all","Tümü"],["plan","Programdakiler"],...DAYS.map(d=>[d[0],d[1]+" "+(d[0].startsWith("2027")?"Oca":"Ara")])].map(([k,t])=>`<button class="chip ${mapDay===k?"on":""}" data-md="${k}">${t}</button>`).join("");
  LL.clearLayers();
  const dayOf=i=>plan[i.id]||i.when;
  let list=items.filter(i=>i.lat&&i.lng&&i.cat!=="ucus");
  if(mapDay==="plan")list=list.filter(i=>dayOf(i));
  else if(mapDay!=="all")list=list.filter(i=>dayOf(i)===mapDay).sort((a,b)=>(a.time||"99").localeCompare(b.time||"99"));
  const pts=[];
  list.forEach((it,n)=>{const C=CATS[it.cat]||CATS.deneyim,B=both(it.id),ll=[it.lat,it.lng];pts.push(ll);
    const lbl=(mapDay!=="all"&&mapDay!=="plan")?(n+1):(it.emoji||C.e);
    const ic=L.divIcon({className:"",iconSize:[34,34],iconAnchor:[17,17],html:`<div class="pin ${B?"ok":""} ${mapSel===it.id?"sel":""}" style="--c:${B?"#4fd69c":C.dot}"><span>${esc(lbl)}</span></div>`});
    L.marker(ll,{icon:ic}).addTo(LL).on("click",()=>{mapSel=it.id;$("#mapcard").innerHTML=card(it);$("#mapcard").scrollIntoView({behavior:"smooth",block:"start"})}).bindTooltip(esc(it.title),{direction:"top",offset:[0,-16]});
  });
  if(mapDay!=="all"&&mapDay!=="plan"&&pts.length>1)L.polyline(pts,{color:"#d9b45a",weight:2.5,opacity:.8,dashArray:"6 6"}).addTo(LL);
  if(pts.length&&mapDay!=="all")LM.fitBounds(pts,{padding:[30,30],maxZoom:15});else if(mapDay==="all"&&!LM._f){LM.setView([40.733,-73.985],13);LM._f=1}
  const used=[...new Set(list.map(i=>i.cat))].filter(c=>CATS[c]);
  $("#mleg").innerHTML=used.map(c=>`<span><i style="background:${CATS[c].dot}"></i>${CATS[c].n}</span>`).join("")+`<span><i style="background:#4fd69c"></i>İkiniz de</span>`;
  const sel=items.find(i=>i.id===mapSel);
  $("#mapcard").innerHTML=sel?card(sel):`<div class="info">${list.length} nokta. Bir pine dokun, kartı burada açılsın. Gün seçersen o günün rotası sırayla numaralanır.</div>`;
}
function rChat(){
  const el=$("#chat");
  let h=`<div class="info">Burası ikinizin ve Claude'un ortak sohbeti. <b>"Şunu severiz"</b> diye yazın: mutfak, müzik, mahalle, bütçe, ruh hali… Claude her sabah bu mesajları okuyup araştırıyor, yanıt yazıyor ve yeni kartları Keşfet'e ekliyor.</div>`;
  h+=chat.map(m=>{const cls=m.role==="claude"?"ai":(m.p===ME?"me":"them"),w=m.role==="claude"?"✨ Claude":NAME[m.p]||m.p;
    return `<div class="msg ${cls}"><div class="w">${esc(w)} · ${new Date(m.ts).toLocaleString("tr-TR",{day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit"})}</div>${esc(m.text)}</div>`}).join("");
  el.innerHTML=h;
}
function rPeople(){
  const n=k=>Object.values(votes[k]||{}).filter(v=>v===1).length;
  $("#people").innerHTML=["necmi","ahmet"].map(k=>`<span class="pp ${k===ME?"me":""}"><i style="background:${COL[k]}">${NAME[k][0]}</i>${NAME[k]}${k===ME?" (sen)":""} · ${n(k)} 👍</span>`).join("")+`<button class="pp" id="sw" style="padding-left:12px">⇄ değiştir</button>`;
}
function render(){
  const d=Math.ceil((new Date("2026-12-25T08:05:00+03:00")-Date.now())/864e5);$("#cd").textContent=d>0?d:"🎄";
  if(!ME)return;rPeople();({plan:rPlan,ozel:rOzel,kesfet:rKesfet,harita:rHarita,chat:rChat})[tab]();
}

/* ---------- notifications (in-app) ---------- */
let seenAt=+ls("nyc_seen")||0,chatSeen=+ls("nyc_chat")||0;
function notify(){
  const nw=items.filter(i=>(i.addedAt||0)>seenAt);
  const nc=chat.filter(m=>m.ts>chatSeen&&m.p!==ME);
  $("#dotK").classList.toggle("on",nw.length>0&&!!seenAt);
  $("#dotC").classList.toggle("on",nc.length>0&&tab!=="chat");
  if(seenAt&&(nw.length||nc.length)){const n=$("#news");n.innerHTML=`🔔 ${nw.length?`<b>${nw.length} yeni öneri</b>: ${nw.slice(0,3).map(i=>esc(i.title)).join(", ")}${nw.length>3?"…":""}`:""}${nw.length&&nc.length?"<br>":""}${nc.length?`💬 <b>${nc.length} yeni mesaj</b> (${[...new Set(nc.map(m=>m.role==="claude"?"Claude":NAME[m.p]))].join(", ")})`:""}`;n.classList.add("show")}
  if(!seenAt){seenAt=Date.now();ls("nyc_seen",String(seenAt))}
}
function markSeen(){if(tab==="kesfet"){setTimeout(()=>{seenAt=Date.now();ls("nyc_seen",String(seenAt));$("#dotK").classList.remove("on")},4000)}
  if(tab==="chat"){chatSeen=Date.now();ls("nyc_chat",String(chatSeen));$("#dotC").classList.remove("on")}}

/* ---------- events ---------- */
$("#nav").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;tab=b.dataset.v;
  document.querySelectorAll("#nav button").forEach(x=>x.classList.toggle("on",x===b));
  document.querySelectorAll(".view").forEach(v=>v.classList.toggle("on",v.id==="v-"+tab));
  $("#composer").classList.toggle("on",tab==="chat");$("#news").classList.remove("show");render();markSeen();
  window.scrollTo({top:tab==="chat"?document.body.scrollHeight:0})});
const pending=new Map();
document.addEventListener("click",async e=>{
  const md=e.target.closest("[data-md]");if(md){mapDay=md.dataset.md;mapSel=null;rHarita();return}
  const f=e.target.closest("[data-f]");if(f){filter=f.dataset.f;render();return}
  const p=e.target.closest("[data-pin]");if(p){mapSel=p.dataset.pin;render();$("#mapcard").scrollIntoView({behavior:"smooth",block:"start"});return}
  if(e.target.closest("#sw")){ls("nyc_me","");ME=null;gate();return}
  const v=e.target.closest("[data-vote]");if(v){const id=v.dataset.vote,s=+v.dataset.s,nv=mv(id)===s?0:s;
    votes[ME]={...votes[ME]};if(nv)votes[ME][id]=nv;else delete votes[ME][id];pending.set(id,nv);render();
    try{await rpc("trip_vote",{k:K,p:ME,i:id,val:nv})}catch(err){flash("Oy kaydedilemedi, tekrar dene.")}pending.delete(id);lastSig="";return}
  const bk=e.target.closest("[data-book]");if(bk){const id=bk.dataset.book,nb=!booked[id];if(nb)booked[id]=ME;else delete booked[id];render();
    try{await rpc("trip_booked",{k:K,i:id,p:ME,b:nb})}catch(err){flash("Kaydedilemedi.")}lastSig="";return}
  const w=e.target.closest("[data-me]");if(w){ME=w.dataset.me;ls("nyc_me",ME);$("#gate").classList.remove("on");render();markSeen()}
});
document.addEventListener("change",async e=>{const s=e.target.closest("select[data-day]");if(!s)return;const id=s.dataset.day;
  if(s.value)plan[id]=s.value;else delete plan[id];render();try{await rpc("trip_plan",{k:K,i:id,d:s.value||null})}catch(err){flash("Kaydedilemedi.")}lastSig=""});
$("#send").addEventListener("click",async()=>{const t=$("#msg").value.trim();if(!t)return;$("#msg").value="";
  chat.push({p:ME,role:"user",text:t,ts:Date.now()});rChat();window.scrollTo({top:document.body.scrollHeight});
  try{await rpc("trip_chat",{k:K,p:ME,t});lastSig="";load()}catch(err){flash("Mesaj gönderilemedi.")}});
function flash(t){const n=$("#news");n.textContent=t;n.classList.add("show");setTimeout(()=>n.classList.remove("show"),5000)}

/* ---------- gate ---------- */
function gate(){const g=$("#gate");g.classList.add("on");
  if(!K){$("#g-code").style.display="block";$("#g-who").style.display="none"}else{$("#g-code").style.display="none";$("#g-who").style.display="block"}}
$("#codego").addEventListener("click",()=>{const v=$("#codein").value.trim();if(!v)return;K=v;ls("nyc_k",K);boot()});

/* ---------- skyline + snow ---------- */
(function sky(){let s='<defs><linearGradient id="sk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0f1a33"/><stop offset="1" stop-color="#070d1c"/></linearGradient></defs>';let x=0,i=0;
  while(x<680){const w=20+(i*37)%30,h=35+(i*53)%55;let b=`<rect x="${x}" y="${120-h}" width="${w}" height="${h}" fill="url(#sk)"/>`;
    for(let wy=120-h+6;wy<116;wy+=8)for(let wx=x+4;wx<x+w-3;wx+=6)if((wx*7+wy*3+i)%4===0)b+=`<rect x="${wx}" y="${wy}" width="2" height="3" fill="#ffd98a" opacity=".7"/>`;s+=b;x+=w+1;i++}
  s+=`<g fill="#0c162c"><path d="M330 120V40h6V22h4V4h2v18h4v18h6v80z"/><path d="M430 120V50l8-14 8 14v70z"/><path d="M438 36l-2-8h4z"/></g><g fill="#d9b45a" opacity=".9"><circle cx="341" cy="4" r="1.6"/><path d="M432 52l6-12 6 12z" opacity=".5"/></g>`;
  $("#sky").innerHTML=s})();
(function snow(){const c=$("#snow"),x=c.getContext("2d");let W,H,f=[];function rs(){W=c.width=innerWidth*devicePixelRatio;H=c.height=innerHeight*devicePixelRatio;c.style.width=innerWidth+"px";c.style.height=innerHeight+"px"}rs();addEventListener("resize",rs);
  for(let i=0;i<70;i++)f.push({x:Math.random(),y:Math.random(),r:.6+Math.random()*1.8,s:.15+Math.random()*.45,d:Math.random()*6});
  const red=matchMedia("(prefers-reduced-motion: reduce)").matches;
  function t(){x.clearRect(0,0,W,H);x.fillStyle="rgba(255,255,255,.75)";for(const p of f){p.y+=p.s/1000*3;p.d+=.01;if(p.y>1){p.y=-.02;p.x=Math.random()}x.beginPath();x.arc((p.x+Math.sin(p.d)*.01)*W,p.y*H,p.r*devicePixelRatio,0,7);x.fill()}if(!red)requestAnimationFrame(t)}t()})();

/* ---------- boot ---------- */
function boot(){
  const u=new URLSearchParams(location.search);if(u.get("k")){K=u.get("k");ls("nyc_k",K);history.replaceState(null,"",location.pathname)}
  K=K||ls("nyc_k")||null;ME=ls("nyc_me")||null;
  if(!K||!ME)gate();else $("#gate").classList.remove("on");
  render();if(K){load();clearInterval(window._p);window._p=setInterval(load,10000)}
}
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&K)load()});
boot();
</script>
</body>
